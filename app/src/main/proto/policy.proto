    // DISALLOW_USB_FILE_TRANSFER will be set. A NonComplianceDetail with API_LEVEL is reported if
    // the Android version is less than 12. A NonComplianceDetail with DEVICE_INCOMPATIBLE is
    // reported if the device does not have USB HAL 1.3 or above. usbFileTransferDisabled is
