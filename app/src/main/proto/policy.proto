syntax = "proto3";

// Xamanta policy reference
//
// A policy is a group of settings that govern the behavior of a managed device and the apps
// installed on it. The schema deliberately follows the Android Management API
// (https://developers.google.com/android/management/reference/rest/v1/enterprises.policies), and
// every field that has a counterpart there carries Google's own description. Fields that are
// Xamanta's own say so.
//
// Xamanta operates exclusively as device owner, on a fully managed device. Any setting that only
// makes sense in a work profile is reported as MANAGEMENT_MODE non-compliance.
//
// A policy is the device's entire desired state, not a patch: every reconciliation pass applies the
// whole policy, and a field the policy stops setting is withdrawn from the device.
//
// How Xamanta translates each setting into an Android primitive, the minimum API level it needs,
// and the settingName it reports on failure are in doc/policy-spec.md. This file is the wire
// contract; that document is the behaviour.
package policy;

option java_package = "cat.naval.xamanta.protos";
option java_outer_classname = "PolicyProto";
option java_multiple_files = true;
option csharp_namespace = "XamantaC2";

// A policy resource represents a group of settings that govern the behavior of a managed device and
// the apps installed on it.
message Policy {
  reserved 1, 2;

  // The name of the policy in the form enterprises/{enterpriseId}/policies/{policyId}.
  string name = 3;

  // The version of the policy. This is a read-only field. The version is incremented each time the
  // policy is updated.
  int32 version = 4;

  // Free text describing the policy. Shown on the DPC's sync screen only; it has no effect on what
  // is applied.
  string description = 5;

  // The settings to apply to the device. Absent is equivalent to an empty DevicePolicy, which is
  // not the same as an unrestricted device: several settings default to their restrictive value.
  DevicePolicy device_policy = 6;

  // The version of the DPC itself that the device should be running. Absent means no self-update is
  // requested.
  SelfUpdate self_update = 7;
}

// Instructs the DPC to update itself. Xamanta-specific: with no Google Play dependency the server
// supplies the APK, so the DPC verifies it the way a store would. The update is installed only when
// version_code is strictly greater than the running version, the APK is the same package, its own
// versionCode is greater, it shares at least one signing certificate with the installed DPC, it is
// at most 256 MiB, and sha256_sum matches if given. It runs even when the DPC has lost device
// owner, which makes it the only route back.
message SelfUpdate {
  // The target PackageInfo.longVersionCode. The DPC acts only when this is strictly greater than
  // the version it is running.
  int64  version_code = 1;

  // The URL of the APK. HTTPS only; any other scheme fails with NOT_FOUND.
  string download_url = 2;

  // The SHA-256 of the APK in hexadecimal. When present it must match the downloaded bytes.
  // Optional: without it, integrity rests on HTTPS and on the signing certificate matching the
  // installed DPC.
  string sha256_sum   = 3;
}

// A policy resource represents a group of settings that govern the behavior of a managed device and
// the apps installed on it.
message DevicePolicy {
  // A free-form identifier for the server's own bookkeeping. The device never reads it.
  string id = 1;

  reserved 2;

  // Policy applied to apps. This can have at most 3,000 elements.
  repeated ApplicationPolicy applications = 3;

  // Whether adding new users and profiles is disabled. For devices where managementMode is
  // DEVICE_OWNER this field is ignored and the user is never allowed to add or remove users.
  bool add_user_disabled = 4;

  // Whether adjusting the master volume is disabled. Also mutes the device. The setting has effect
  // only on fully managed devices.
  bool adjust_volume_disabled = 5;

  // Whether factory resetting from settings is disabled.
  bool factory_reset_disabled = 6;

  // Whether user installation of apps is disabled.
  bool install_apps_disabled = 7;

  // Whether the user mounting physical external media is disabled.
  bool mount_physical_media_disabled = 8;

  // Whether adding or removing accounts is disabled.
  bool modify_accounts_disabled = 9;

  // Whether user uninstallation of applications is disabled. This prevents apps from being
  // uninstalled, even those removed using applications
  bool uninstall_apps_disabled = 11;

  // If true, this disables the Lock Screen
  // (https://source.android.com/docs/core/display/multi_display/lock-screen) for primary and/or
  // secondary displays. This policy is supported only in dedicated device management mode.
  bool keyguard_disabled = 13;

  // Whether configuring bluetooth is disabled.
  bool bluetooth_config_disabled = 14;

  // Whether configuring cell broadcast is disabled.
  bool cell_broadcasts_config_disabled = 15;

  // Whether configuring user credentials is disabled.
  bool credentials_config_disabled = 16;

  // Whether configuring mobile networks is disabled.
  bool mobile_networks_config_disabled = 17;

  // Whether configuring VPN is disabled.
  bool vpn_config_disabled = 19;

  // Whether creating windows besides app windows is disabled.
  bool create_windows_disabled = 21;

  // Whether resetting network settings is disabled. This applies only on fully managed devices. A
  // NonComplianceDetail with MANAGEMENT_MODE is reported for other management modes.
  bool network_reset_disabled = 22;

  // Whether using NFC to beam data from apps is disabled.
  bool outgoing_beam_disabled = 23;

  // Whether outgoing calls are disabled.
  bool outgoing_calls_disabled = 24;

  // Whether removing other users is disabled.
  bool remove_user_disabled = 25;

  // Whether sending and receiving SMS messages is disabled.
  bool sms_disabled = 27;

  // Whether the user is allowed to have fun. Controls whether the Easter egg game in Settings is
  // disabled.
  bool fun_disabled = 32;

  // Whether screen capture is disabled. This also blocks Circle to Search
  // (https://support.google.com/android/answer/14508957).
  bool screen_capture_disabled = 34;

  reserved 36;

  reserved 43, 44, 45;

  // Maximum time in milliseconds for user activity until the device locks. A value of 0 means there
  // is no restriction.
  int64 maximum_time_to_lock_ms = 37;

  // Disabled keyguard customizations, such as widgets.
  int32 keyguard_disabled_features = 38;

  // If present, only the input methods provided by packages in this list are permitted. If this
  // field is present, but the list is empty, then only system input methods are permitted.
  PackageNameList permitted_input_methods = 39;

  // Specifies permitted accessibility services. If the field is not set, any accessibility service
  // can be used. If the field is set, only the accessibility services in this list and the system's
  // built-in accessibility service can be used. In particular, if the field is set to empty, only
  // the system's built-in accessibility servicess can be used. This can be set on fully managed
  // devices and on work profiles. When applied to a work profile, this affects both the personal
  // profile and the work profile.
  PackageNameList permitted_accessibility_services = 40;

  // The system update policy, which controls how OS updates are applied. If the update type is
  // WINDOWED, the update window will automatically apply to Play app updates as well.Note: Google
  // Play system updates (https://source.android.com/docs/core/ota/modular-system) (also called
  // Mainline updates) are automatically downloaded and require a device reboot to be installed.
  // Refer to the mainline section in Manage system updates
  // (https://developer.android.com/work/dpc/system-updates#mainline) for further details.
  SystemUpdate system_update = 41;

  // The battery plugged in modes for which the device stays on. When using this setting, it is
  // recommended to clear maximum_time_to_lock so that the device doesn't lock itself while it stays
  // on.
  repeated BatteryPluggedMode stay_on_plugged_modes = 42;

  // Factory reset protection: which accounts may provision the device after a factory reset. Absent
  // clears the policy.
  FactoryResetProtection factory_reset_protection = 46;

  // The default permission policy for runtime permission requests.
  PermissionPolicy default_permission_policy = 47;

  // Settings controlling the behavior of a device in kiosk mode. To enable kiosk mode, set
  // kioskCustomLauncherEnabled to true or specify an app in the policy with installType KIOSK.
  KioskCustomization kiosk_customization = 48;

  // Whether bluetooth is disabled. Prefer this setting over bluetooth_config_disabled because
  // bluetooth_config_disabled can be bypassed by the user.
  bool bluetooth_disabled = 50;

  // Whether bluetooth contact sharing is disabled.
  bool bluetooth_contact_sharing_disabled = 51;

  // Whether roaming data services are disabled.
  bool data_roaming_disabled = 52;

  // Whether changing the user icon is disabled. This applies only on devices running Android 7 and
  // above.
  bool set_user_icon_disabled = 53;

  // Whether changing the wallpaper is disabled.
  bool set_wallpaper_disabled = 54;

  // Flag to skip hints on the first use. Enterprise admin can enable the system recommendation for
  // apps to skip their user tutorial and other introductory hints on first start-up.
  bool skip_first_use_hints_enabled = 55;

  // The degree of location detection enabled.
  LocationMode location_mode = 56;

  // Optional. Controls whether printing is allowed. This is supported on devices running Android 9
  // and above. .
  PrintingPolicy printing_policy = 57;

  // Controls the use of the camera and whether the user has access to the camera access toggle.
  CameraAccess camera_access = 58;

  // Controls the use of the microphone and whether the user has access to the microphone access
  // toggle. This applies only on fully managed devices.
  MicrophoneAccess microphone_access = 59;

  // Whether auto date, time, and time zone are enabled on a company-owned device. If this is set,
  // then autoTimeRequired is ignored.
  AutoDateAndTimeZone auto_date_and_time_zone = 60;

  // Optional. Controls whether AssistContent
  // (https://developer.android.com/reference/android/app/assist/AssistContent) is allowed to be
  // sent to a privileged app such as an assistant app. AssistContent includes screenshots and
  // information about an app, such as package name. This is supported on Android 15 and above.
  AssistContentPolicy assist_content_policy = 61;

  // Whether encryption is enabled
  EncryptionPolicy encryption_policy = 62;

  // Controls the Memory Tagging Extension on the device.
  MtePolicy mte_policy = 63;

  // Optional. Controls which apps are allowed to act as credential providers on Android 14 and
  // above. These apps store credentials, see this (https://developer.android.com/training/sign-
  // in/passkeys) and this
  // (https://developer.android.com/reference/androidx/credentials/CredentialManager) for details.
  // See also credentialProviderPolicy.
  CredentialProviderPolicyDefault credential_provider_policy_default = 64;

  // Advanced security settings. In most cases, setting these is not needed.
  AdvancedSecurityOverrides advanced_security_overrides = 65;

  // Optional. Covers controls for radio state such as Wi-Fi, bluetooth, and more.
  DeviceRadioState device_radio_state = 66;

  // Covers controls for device connectivity such as Wi-Fi, USB data access, keyboard/mouse
  // connections, and more.
  DeviceConnectivityManagement device_connectivity_management = 67;

  // Optional. Controls for the display settings.
  DisplaySettings display_settings = 68;

  // Configuration for an always-on VPN connection. Use with vpn_config_disabled to prevent
  // modification of this setting.
  AlwaysOnVpnPackage always_on_vpn_package = 69;

  // The network-independent global HTTP proxy. Typically proxies should be configured per-network
  // in open_network_configuration. However for unusual configurations like general internal
  // filtering a global HTTP proxy may be useful. If the proxy is not accessible, network access may
  // break. The global proxy is only a recommendation and some apps may ignore it.
  ProxyInfo recommended_global_proxy = 70;

  // Account types that can't be managed by the user.
  repeated string account_types_with_management_disabled = 71;

  // Default intent handler activities.Warning: Do not configure this and
  // default_application_settings for the same intent domain, such as web browsing. Setting both for
  // the same intent domain can lead to unpredictable behavior.
  repeated PersistentPreferredActivity persistent_preferred_activities = 72;

  // Password requirement policies. Different policies can be set for work profile or fully managed
  // devices by setting the password_scope field in the policy.
  repeated PasswordRequirements password_policies = 73;

  // Optional. The default application setting for supported types. If the default application is
  // successfully set for at least one app type on a profile, users are prevented from changing any
  // default applications on that profile.Only one DefaultApplicationSetting is allowed for each
  // DefaultApplicationType.Warning: Do not configure this and persistent_preferred_activities for
  // the same intent domain, such as web browsing. Setting both for the same intent domain can lead
  // to unpredictable behavior.See Default application settings
  // (https://developers.google.com/android/management/default-application-settings) guide for more
  // details.
  repeated DefaultApplicationSetting default_application_settings = 74;

  // Optional. Controls whether apps on the device for fully managed devices or in the work profile
  // for devices with work profiles are allowed to expose app functions.
  AppFunctions app_functions = 75;

  // Optional. Wipe flags to indicate what data is wiped when a device or profile wipe is triggered
  // due to any reason (for example, non-compliance). This does not apply to the
  // enterprises.devices.delete method. . This list must not have duplicates.
  repeated WipeDataFlag wipe_data_flags = 76;

  // The minimum allowed Android API level.
  int32 minimum_api_level = 77;

  // Status reporting settings
  StatusReportingSettings status_reporting_settings = 78;

  // Rules for determining apps' access to private keys. See ChoosePrivateKeyRule for details. This
  // must be empty if any application has CERT_SELECTION delegation scope.
  repeated ChoosePrivateKeyRule choose_private_key_rules = 79;

  // Network configuration for the device. See configure networks for more information.
  OpenNetworkConfiguration open_network_configuration = 80;

  // Controls whether preferential network service is enabled on the work profile or on fully
  // managed devices. For example, an organization may have an agreement with a carrier that all of
  // the work data from its employees' devices will be sent via a network service dedicated for
  // enterprise use. An example of a supported preferential network service is the enterprise slice
  // on 5G networks. This policy has no effect if preferentialNetworkServiceSettings or
  // ApplicationPolicy.preferentialNetworkId is set on devices running Android 13 or above.
  PreferentialNetworkService preferential_network_service = 81;

  // The device owner information to be shown on the lock screen.
  UserFacingMessage device_owner_lock_screen_info = 82;

  // A message displayed to the user in the settings screen wherever functionality has been disabled
  // by the admin. If the message is longer than 200 characters it may be truncated.
  UserFacingMessage short_support_message = 83;

  // A message displayed to the user in the device administators settings screen.
  UserFacingMessage long_support_message = 84;
}

// Provides a user-facing message with locale info. The maximum message length is 4096 characters.
message UserFacingMessage {
  // The default message displayed if no localized message is specified or the user's locale doesn't
  // match with any of the localized messages. A default message must be provided if any localized
  // messages are provided.
  string default_message = 1;

  // A map containing pairs, where locale is a well-formed BCP 47 language
  // (https://www.w3.org/International/articles/language-tags/) code, such as en-US, es-ES, or fr.
  map<string, string> localized_messages = 2;
}

// Settings controlling the behavior of a device in kiosk mode. To enable kiosk mode, set
// kioskCustomLauncherEnabled to true or specify an app in the policy with installType KIOSK.
message KioskCustomization {
  enum PowerButtonActions {
    // Unspecified, defaults to POWER_BUTTON_AVAILABLE.
    POWER_BUTTON_ACTIONS_UNSPECIFIED = 0;

    // The power menu (e.g. Power off, Restart) is shown when a user long-presses the Power button
    // of a device in kiosk mode.
    POWER_BUTTON_AVAILABLE = 1;

    // The power menu (e.g. Power off, Restart) is not shown when a user long-presses the Power
    // button of a device in kiosk mode. Note: this may prevent users from turning off the device.
    POWER_BUTTON_BLOCKED = 2;
  }
  enum SystemErrorWarnings {
    // Unspecified, defaults to ERROR_AND_WARNINGS_MUTED.
    SYSTEM_ERROR_WARNINGS_UNSPECIFIED = 0;

    // All system error dialogs such as crash and app not responding (ANR) are displayed.
    ERROR_AND_WARNINGS_ENABLED = 1;

    // All system error dialogs, such as crash and app not responding (ANR) are blocked. When
    // blocked, the system force-stops the app as if the user closes the app from the UI.
    ERROR_AND_WARNINGS_MUTED = 2;
  }
  enum SystemNavigation {
    // Unspecified, defaults to NAVIGATION_DISABLED.
    SYSTEM_NAVIGATION_UNSPECIFIED = 0;

    // Home and overview buttons are enabled.
    NAVIGATION_ENABLED = 1;

    // The home and Overview buttons are not accessible.
    NAVIGATION_DISABLED = 2;

    // Only the home button is enabled.
    HOME_BUTTON_ONLY = 3;
  }
  enum StatusBar {
    // Unspecified, defaults to INFO_AND_NOTIFICATIONS_DISABLED.
    STATUS_BAR_UNSPECIFIED = 0;

    // System info and notifications are shown on the status bar in kiosk mode.Note: For this policy
    // to take effect, the device's home button must be enabled using
    // kioskCustomization.systemNavigation.
    NOTIFICATIONS_AND_SYSTEM_INFO_ENABLED = 1;

    // System info and notifications are disabled in kiosk mode.
    NOTIFICATIONS_AND_SYSTEM_INFO_DISABLED = 2;

    // Only system info is shown on the status bar.
    SYSTEM_INFO_ONLY = 3;
  }
  enum DeviceSettings {
    // Unspecified, defaults to SETTINGS_ACCESS_ALLOWED.
    DEVICE_SETTINGS_UNSPECIFIED = 0;

    // Access to the Settings app is allowed in kiosk mode.
    SETTINGS_ACCESS_ALLOWED = 1;

    // Access to the Settings app is not allowed in kiosk mode.
    SETTINGS_ACCESS_BLOCKED = 2;
  }

  // Sets the behavior of a device in kiosk mode when a user presses and holds (long-presses) the
  // Power button.
  PowerButtonActions power_button_actions = 1;

  // Specifies whether system error dialogs for crashed or unresponsive apps are blocked in kiosk
  // mode. When blocked, the system will force-stop the app as if the user chooses the "close app"
  // option on the UI.
  SystemErrorWarnings system_error_warnings = 2;

  // Specifies which navigation features are enabled (e.g. Home, Overview buttons) in kiosk mode.
  SystemNavigation system_navigation = 3;

  // Specifies whether system info and notifications are disabled in kiosk mode.
  StatusBar status_bar = 4;

  // Specifies whether the Settings app is allowed in kiosk mode.
  DeviceSettings device_settings = 5;
}

// A list of package names.
message PackageNameList {
  // A list of package names.
  repeated string package_names = 1;
}

// Configuration for managing system updatesNote: Google Play system updates
// (https://source.android.com/docs/core/ota/modular-system) (also called Mainline updates) are
// automatically downloaded but require a device reboot to be installed. Refer to the mainline
// section in Manage system updates (https://developer.android.com/work/dpc/system-updates#mainline)
// for further details.
message SystemUpdate {
  enum SystemUpdateType {
    // Follow the default update behavior for the device, which typically requires the user to
    // accept system updates.
    SYSTEM_UPDATE_TYPE_UNSPECIFIED = 0;

    // Install automatically as soon as an update is available.
    AUTOMATIC = 1;

    // Install automatically within a daily maintenance window. This also configures Play apps to be
    // updated within the window. This is strongly recommended for kiosk devices because this is the
    // only way apps persistently pinned to the foreground can be updated by Play.If autoUpdateMode
    // is set to AUTO_UPDATE_HIGH_PRIORITY for an app, then the maintenance window is ignored for
    // that app and it is updated as soon as possible even outside of the maintenance window.
    WINDOWED  = 2;

    // Postpone automatic install up to a maximum of 30 days. This policy does not affect security
    // updates (e.g. monthly security patches).
    POSTPONE  = 3;
  }
  // The type of system update to configure.
  SystemUpdateType type = 1;

  // If the type is WINDOWED, the start of the maintenance window, measured as the number of minutes
  // after midnight in the device's local time. This value must be between 0 and 1439, inclusive.
  int32 start_minutes = 2;

  // If the type is WINDOWED, the end of the maintenance window, measured as the number of minutes
  // after midnight in device's local time. This value must be between 0 and 1439, inclusive. If
  // this value is less than start_minutes, then the maintenance window spans midnight. If the
  // maintenance window specified is smaller than 30 minutes, the actual window is extended to 30
  // minutes beyond the start time.
  int32 end_minutes = 3;
}

enum BatteryPluggedMode {
  // This value is ignored.
  BATTERY_PLUGGED_MODE_UNSPECIFIED = 0;

  // Power source is an AC charger.
  AC = 1;

  // Power source is a USB port.
  USB = 2;

  // Power source is wireless.
  WIRELESS = 3;
}

// Factory reset protection policy. Requires Android 11 and hardware support; a device without it is
// reported as UNSUPPORTED only when the policy asked for it.
message FactoryResetProtection {
  // Account identifiers allowed to provision the device after a factory reset.
  repeated string account_ids = 1;

  // Whether factory reset protection is disabled entirely, letting anyone provision the device
  // after a reset.
  bool disabled = 2;
}

enum PermissionPolicy {
  // Policy not specified. If no policy is specified for a permission at any level, then the PROMPT
  // behavior is used by default.
  PERMISSION_POLICY_UNSPECIFIED = 0;

  // Prompt the user to grant a permission.
  PROMPT = 1;

  // Automatically grant a permission.On Android 12 and above, READ_SMS
  // (https://developer.android.com/reference/android/Manifest.permission#READ_SMS) and following
  // sensor-related permissions can only be granted on fully managed devices: ACCESS_FINE_LOCATION
  // (https://developer.android.com/reference/android/Manifest.permission#ACCESS_FINE_LOCATION)
  // ACCESS_BACKGROUND_LOCATION (https://developer.android.com/reference/android/Manifest.permission
  // #ACCESS_BACKGROUND_LOCATION) ACCESS_COARSE_LOCATION
  // (https://developer.android.com/reference/android/Manifest.permission#ACCESS_COARSE_LOCATION)
  // CAMERA (https://developer.android.com/reference/android/Manifest.permission#CAMERA)
  // RECORD_AUDIO (https://developer.android.com/reference/android/Manifest.permission#RECORD_AUDIO)
  // ACTIVITY_RECOGNITION
  // (https://developer.android.com/reference/android/Manifest.permission#ACTIVITY_RECOGNITION)
  // BODY_SENSORS (https://developer.android.com/reference/android/Manifest.permission#BODY_SENSORS)
  GRANT  = 2;

  // Automatically deny a permission.
  DENY   = 3;
}

// Configuration for an Android permission and its grant state.
message PermissionGrant {
  // The Android permission or group, e.g. android.permission.READ_CALENDAR or
  // android.permission_group.CALENDAR.
  string permission = 1;

  // The policy for granting the permission.
  PermissionPolicy policy = 2;
}

enum InstallType {
  // Unspecified. Defaults to AVAILABLE.
  INSTALL_TYPE_UNSPECIFIED = 0;

  // App is installed on the device
  INSTALLED        = 1;

  // The app is automatically installed regardless of a set maintenance window and can't be removed
  // by the user.
  FORCE_INSTALLED  = 2;

  // The role type for kiosk apps. An app can have this role only if it has installType set to
  // REQUIRED_FOR_SETUP or CUSTOM. Before adding this role to an app with CUSTOM install type, the
  // app must already be installed on the device.The app having this role type is set as the
  // preferred home intent and allowlisted for lock task mode. When there is an app with this role
  // type, status bar will be automatically disabled.This is preferable to setting installType to
  // KIOSK.On Android 11 and above, when an app has this role, the user control is disallowed for
  // all apps. The IT admin can set userControlSettings to USER_CONTROL_ALLOWED to allow user
  // control for specific apps.
  KIOSK            = 3;

  // The app is blocked and can't be installed in the personal profile. If the app was previously
  // installed in the device, it will be uninstalled.
  BLOCKED          = 4;

  // The app is available to install in the personal profile.
  AVAILABLE        = 5;
}

// Policy for an individual app. Note: Application availability on a given device cannot be changed
// using this policy if installAppsDisabled is enabled. The maximum number of applications that you
// can specify per policy is 3,000.
message ApplicationPolicy {
  // The package name of the app. For example, com.google.android.youtube for the YouTube app.
  string package_name = 1;

  // The URL of the APK to install. HTTPS only. Xamanta-specific: apps are not installed from Google
  // Play, so the policy names the bytes. Required for INSTALLED, FORCE_INSTALLED and KIOSK when the
  // app is neither installed already nor a system app.
  string download_url = 2;

  // The SHA-256 of the APK in hexadecimal, case-insensitive. When present it pins one exact build,
  // and a download that does not match is rejected.
  string sha256_sum   = 3;

  // The type of installation to perform.
  InstallType install_type = 4;

  // Explicit permission grants or denials for the app. These values override the
  // default_permission_policy and permission_grants which apply to all apps.
  repeated PermissionGrant permission_grants = 5;

  // The minimum version of the app that runs on the device. If set, the device attempts to update
  // the app to at least this version code. If the app is not up-to-date, the device will contain a
  // NonComplianceDetail with non_compliance_reason set to APP_NOT_UPDATED. The app must already be
  // published to Google Play with a version code greater than or equal to this value. At most 20
  // apps may specify a minimum version code per policy.
  int64 minimum_version_code = 6;

  // The default policy for all permissions requested by the app. If specified, this overrides the
  // policy-level default_permission_policy which applies to all apps. It does not override the
  // permission_grants which applies to all apps.
  PermissionPolicy default_permission_policy = 7;

  // Managed configuration applied to the app. The format for the configuration is dictated by the
  // ManagedProperty values supported by the app. Each field name in the managed configuration must
  // match the key field of the ManagedProperty. The field value must be compatible with the type of
  // the ManagedProperty: *type* *JSON value* BOOL true or false STRING string INTEGER number CHOICE
  // string MULTISELECT array of strings HIDDEN string BUNDLE_ARRAY array of objects Note: string
  // values cannot be longer than 65535 characters.
  repeated ManagedProperty managed_configuration = 8;

  // The scopes delegated to the app from Android Device Policy. These provide additional privileges
  // for the applications they are applied to.
  repeated DelegatedScope delegated_scopes = 9;

  // Specifies whether the app is allowed networking when the VPN is not connected and
  // alwaysOnVpnPackage.lockdownEnabled is enabled. If set to VPN_LOCKDOWN_ENFORCED, the app is not
  // allowed networking, and if set to VPN_LOCKDOWN_EXEMPTION, the app is allowed networking. Only
  // supported on devices running Android 10 and above. If this is not supported by the device, the
  // device will contain a NonComplianceDetail with non_compliance_reason set to API_LEVEL and a
  // fieldPath. If this is not applicable to the app, the device will contain a NonComplianceDetail
  // with non_compliance_reason set to UNSUPPORTED and a fieldPath. The fieldPath is set to
  // applications[i].alwaysOnVpnLockdownExemption, where i is the index of the package in the
  // applications policy.
  AlwaysOnVpnLockdownExemption always_on_vpn_lockdown_exemption = 10;

  // Optional. Whether the app is allowed to act as a credential provider on Android 14 and above.
  CredentialProviderPolicy credential_provider_policy = 11;

  // Optional. Specifies whether user control is permitted for the app. User control includes user
  // actions like force-stopping and clearing app data. Certain types of apps have special
  // treatment, see USER_CONTROL_SETTINGS_UNSPECIFIED and USER_CONTROL_ALLOWED for more details.
  UserControlSettings user_control_settings = 12;

  // Optional. ID of the preferential network the application uses. There must be a configuration
  // for the specified network ID in preferentialNetworkServiceConfigs. If set to
  // PREFERENTIAL_NETWORK_ID_UNSPECIFIED, the application will use the default network ID specified
  // in defaultPreferentialNetworkId. See the documentation of defaultPreferentialNetworkId for the
  // list of apps excluded from this defaulting. This applies on both work profiles and fully
  // managed devices on Android 13 and above.
  PreferentialNetworkId preferential_network_id = 13;

  // Optional. Signing key certificates of the app.This field is required in the following cases:
  // The app has installType set to CUSTOM (i.e. a custom app). The app has roles set to a nonempty
  // list and the app does not exist on the Play Store. The app has extensionConfig set (i.e. an
  // extension app) but ExtensionConfig.signingKeyFingerprintsSha256 (deprecated) is not set and the
  // app does not exist on the Play Store.If this field is not set for a custom app, the policy is
  // rejected. If it is not set when required for a non-custom app, a NonComplianceDetail with
  // INVALID_VALUE is reported.For other cases, this field is optional and the signing key
  // certificates obtained from Play Store are used.See following policy settings to see how this
  // field is used: choosePrivateKeyRules ApplicationPolicy.InstallType.CUSTOM
  // ApplicationPolicy.extensionConfig ApplicationPolicy.roles
  repeated ApplicationSigningKeyCert signing_key_certs = 14;

  enum DelegatedScope {
    // No delegation scope specified.
    DELEGATED_SCOPE_UNSPECIFIED = 0;

    // Grants access to certificate installation and management. This scope can be delegated to
    // multiple applications.
    CERT_INSTALL           = 1;

    // The managed configurations page (https://developers.google.com/android/management/managed-
    // configurations-iframe).
    MANAGED_CONFIGURATIONS = 2;

    // Grants access to blocking uninstallation. This scope can be delegated to multiple
    // applications.
    BLOCK_UNINSTALL        = 3;

    // Grants access to permission policy and permission grant state. This scope can be delegated to
    // multiple applications.
    PERMISSION_GRANT       = 4;

    // Grants access to package access state. This scope can be delegated to multiple applications.
    PACKAGE_ACCESS         = 5;

    // Grants access for enabling system apps. This scope can be delegated to multiple applications.
    ENABLE_SYSTEM_APP      = 6;

    // Enable logging of on-device network events, such as DNS lookups and TCP connections. See
    // UsageLogEvent for a complete description of the logged network events. Supported for fully
    // managed devices on Android 8 and above. Supported for company-owned devices with a work
    // profile on Android 12 and above, on which only network events from the work profile are
    // logged. Can be overridden by the application delegated scope NETWORK_ACTIVITY_LOGS
    NETWORK_ACTIVITY_LOGS  = 7;

    // Enable logging of on-device security events, such as when the device password is incorrectly
    // entered or removable storage is mounted. See UsageLogEvent for a complete description of the
    // logged security events. Supported for fully managed devices on Android 7 and above. Supported
    // for company-owned devices with a work profile on Android 12 and above, on which only security
    // events from the work profile are logged. Can be overridden by the application delegated scope
    // SECURITY_LOGS
    SECURITY_LOGS          = 8;

    // Grants access to selection of KeyChain certificates on behalf of requesting apps. Once
    // granted, the delegated application will start receiving
    // DelegatedAdminReceiver#onChoosePrivateKeyAlias (https://developer.android.com/reference/andro
    // id/app/admin/DelegatedAdminReceiver#onChoosePrivateKeyAlias%28android.content.Context,%20andr
    // oid.content.Intent,%20int,%20android.net.Uri,%20java.lang.String%29). Allows the delegated
    // application to call grantKeyPairToApp (https://developer.android.com/reference/android/app/ad
    // min/DevicePolicyManager#grantKeyPairToApp%28android.content.ComponentName,%20java.lang.String
    // ,%20java.lang.String%29) and revokeKeyPairFromApp (https://developer.android.com/reference/an
    // droid/app/admin/DevicePolicyManager#revokeKeyPairFromApp%28android.content.ComponentName,%20j
    // ava.lang.String,%20java.lang.String%29) methods. This scope can be delegated to at most one
    // application. choosePrivateKeyRules must be empty and privateKeySelectionEnabled has no effect
    // if certificate selection is delegated to an application.
    CERT_SELECTION         = 9;
  }

  enum AlwaysOnVpnLockdownExemption {
    // Unspecified. Defaults to VPN_LOCKDOWN_ENFORCED.
    ALWAYS_ON_VPN_LOCKDOWN_EXEMPTION_UNSPECIFIED = 0;

    // The app respects the always-on VPN lockdown setting.
    VPN_LOCKDOWN_ENFORCED  = 1;

    // The app is exempt from the always-on VPN lockdown setting.
    VPN_LOCKDOWN_EXEMPTION = 2;
  }

  enum CredentialProviderPolicy {
    // Unspecified. The behaviour is governed by credentialProviderPolicyDefault.
    CREDENTIAL_PROVIDER_POLICY_UNSPECIFIED = 0;

    // App is allowed to act as a credential provider.
    CREDENTIAL_PROVIDER_ALLOWED = 1;
  }

  enum UserControlSettings {
    // Uses the default behaviour of the app to determine if user control is allowed or disallowed.
    // User control is allowed by default for most apps but disallowed for following types of apps:
    // extension apps (see extensionConfig for more details) kiosk apps (see KIOSK install type for
    // more details) apps with roles set to a nonempty list other critical system apps
    USER_CONTROL_SETTINGS_UNSPECIFIED = 0;

    // User control is allowed for the app. Kiosk apps can use this to allow user control. For
    // extension apps (see extensionConfig for more details), user control is disallowed even if
    // this value is set.For apps with roles set to a nonempty list (except roles containing only
    // KIOSK role), this value cannot be set.For kiosk apps (see KIOSK install type and KIOSK role
    // type for more details), this value can be used to allow user control.
    USER_CONTROL_ALLOWED    = 1;

    // User control is disallowed for the app. This is supported on Android 11 and above. A
    // NonComplianceDetail with API_LEVEL is reported if the Android version is less than 11.
    USER_CONTROL_DISALLOWED = 2;
  }
}

// The application signing key certificate.
message ApplicationSigningKeyCert {
  // Required. The SHA-256 hash value of the signing key certificate of the app. This must be a
  // valid SHA-256 hash value, i.e. 32 bytes.
  bytes signing_key_cert_fingerprint_sha256 = 1;
}

// Managed property.
message ManagedProperty {
  // The unique key that the app uses to identify the property, e.g.
  // "com.google.android.gm.fieldname".
  string key = 1;

  oneof value {
    // The value, for a string or choice restriction.
    string string_value = 2;

    // The value, for a boolean restriction.
    bool   bool_value   = 3;

    // The value, for an integer restriction.
    int32  int_value    = 4;

    // The value, for a multi-select restriction.
    ManagedPropertyStringList  string_list_value  = 5;

    // The value, for a bundle restriction.
    ManagedPropertyBundle      bundle_value       = 6;

    // The value, for a bundle array restriction.
    ManagedPropertyBundleArray bundle_array_value = 7;
  }
}

// A list of strings, for a multi-select managed property. A separate message because a proto3 oneof
// cannot hold a repeated field.
message ManagedPropertyStringList {
  // The string values.
  repeated string values = 1;
}

// A bundle of managed properties, for a bundle managed property.
message ManagedPropertyBundle {
  // The properties in the bundle. Keys must be unique within it.
  repeated ManagedProperty properties = 1;
}

// A list of bundles, for a bundle array managed property.
message ManagedPropertyBundleArray {
  // The bundles in the array.
  repeated ManagedPropertyBundle bundles = 1;
}

enum LocationMode {
  // Defaults to LOCATION_USER_CHOICE.
  LOCATION_MODE_UNSPECIFIED = 0;

  // Location setting is not restricted on the device. No specific behavior is set or enforced.
  LOCATION_USER_CHOICE = 1;

  // Enable location setting on the device. Important: On Android 11 and above, work profiles on
  // company-owned devices cannot directly enforce enabling of location services. When
  // LOCATION_ENFORCED is set, then a NonComplianceDetail with USER_ACTION is reported. Compliance
  // can only be restored once the user manually turns on location services through the device's
  // Settings application.
  LOCATION_ENFORCED = 2;

  // Disable location setting on the device. Important: On Android 11 and above, work profiles on
  // company-owned devices cannot directly enforce disabling of location services. When
  // LOCATION_DISABLED is set, then a nonComplianceDetail with USER_ACTION is reported. Compliance
  // can only be restored once the user manually turns off location services through the device's
  // Settings application.
  LOCATION_DISABLED = 3;
}

enum PrintingPolicy {
  // Unspecified. Defaults to PRINTING_ALLOWED.
  PRINTING_POLICY_UNSPECIFIED = 0;

  // Printing is disallowed. A NonComplianceDetail with API_LEVEL is reported if the Android version
  // is less than 9.
  PRINTING_DISALLOWED = 1;

  // Printing is allowed.
  PRINTING_ALLOWED = 2;
}

enum CameraAccess {
  // If camera_disabled is true, this is equivalent to CAMERA_ACCESS_DISABLED. Otherwise, this is
  // equivalent to CAMERA_ACCESS_USER_CHOICE.
  CAMERA_ACCESS_UNSPECIFIED = 0;

  // The field camera_disabled is ignored. This is the default device behaviour: all cameras on the
  // device are available. On Android 12 and above, the user can use the camera access toggle.
  CAMERA_ACCESS_USER_CHOICE = 1;

  // The field camera_disabled is ignored. All cameras on the device are disabled (for fully managed
  // devices, this applies device-wide and for work profiles this applies only to the work
  // profile).There are no explicit restrictions placed on the camera access toggle on Android 12
  // and above: on fully managed devices, the camera access toggle has no effect as all cameras are
  // disabled. On devices with a work profile, this toggle has no effect on apps in the work
  // profile, but it affects apps outside the work profile.
  CAMERA_ACCESS_DISABLED = 2;

  // The field camera_disabled is ignored. All cameras on the device are available. On fully managed
  // devices running Android 12 and above, the user is unable to use the camera access toggle. On
  // devices which are not fully managed or which run Android 11 or below, this is equivalent to
  // CAMERA_ACCESS_USER_CHOICE.
  CAMERA_ACCESS_ENFORCED = 3;
}

enum MicrophoneAccess {
  // If unmute_microphone_disabled is true, this is equivalent to MICROPHONE_ACCESS_DISABLED.
  // Otherwise, this is equivalent to MICROPHONE_ACCESS_USER_CHOICE.
  MICROPHONE_ACCESS_UNSPECIFIED = 0;

  // The field unmute_microphone_disabled is ignored. This is the default device behaviour: the
  // microphone on the device is available. On Android 12 and above, the user can use the microphone
  // access toggle.
  MICROPHONE_ACCESS_USER_CHOICE = 1;

  // The field unmute_microphone_disabled is ignored. The microphone on the device is disabled (for
  // fully managed devices, this applies device-wide).The microphone access toggle has no effect as
  // the microphone is disabled.
  MICROPHONE_ACCESS_DISABLED = 2;

  // The field unmute_microphone_disabled is ignored. The microphone on the device is available. On
  // devices running Android 12 and above, the user is unable to use the microphone access toggle.
  // On devices which run Android 11 or below, this is equivalent to MICROPHONE_ACCESS_USER_CHOICE.
  MICROPHONE_ACCESS_ENFORCED = 3;
}

enum AutoDateAndTimeZone {
  // Unspecified. Defaults to AUTO_DATE_AND_TIME_ZONE_USER_CHOICE.
  AUTO_DATE_AND_TIME_ZONE_UNSPECIFIED = 0;

  // Auto date, time, and time zone are left to user's choice.
  AUTO_DATE_AND_TIME_ZONE_USER_CHOICE = 1;

  // Enforce auto date, time, and time zone on the device.
  AUTO_DATE_AND_TIME_ZONE_ENFORCED = 2;
}

enum AssistContentPolicy {
  // Unspecified. Defaults to ASSIST_CONTENT_ALLOWED.
  ASSIST_CONTENT_POLICY_UNSPECIFIED = 0;

  // Assist content is blocked from being sent to a privileged app.Supported on Android 15 and
  // above. A NonComplianceDetail with API_LEVEL is reported if the Android version is less than 15.
  ASSIST_CONTENT_DISALLOWED = 1;

  // Assist content is allowed to be sent to a privileged app.Supported on Android 15 and above.
  ASSIST_CONTENT_ALLOWED = 2;
}

enum EncryptionPolicy {
  // This value is ignored, i.e. no encryption required
  ENCRYPTION_POLICY_UNSPECIFIED = 0;

  // Encryption required but no password required to boot
  ENABLED_WITHOUT_PASSWORD = 1;

  // Encryption required with password required to boot
  ENABLED_WITH_PASSWORD = 2;
}

enum MtePolicy {
  // Unspecified. Defaults to MTE_USER_CHOICE.
  MTE_POLICY_UNSPECIFIED = 0;

  // The user can choose to enable or disable MTE on the device if the device supports this.
  MTE_USER_CHOICE = 1;

  // Memory Tagging Extension is enabled and the user cannot change it. The device reboots to apply
  // the change.
  MTE_ENABLED = 2;

  // MTE is disabled on the device and the user is not allowed to change this setting. This applies
  // only on fully managed devices. In other cases, a NonComplianceDetail with MANAGEMENT_MODE is
  // reported. A NonComplianceDetail with DEVICE_INCOMPATIBLE is reported if the device does not
  // support MTE.Supported on Android 14 and above. A NonComplianceDetail with API_LEVEL is reported
  // if the Android version is less than 14.
  MTE_DISABLED = 3;
}

enum CredentialProviderPolicyDefault {
  // Unspecified. Defaults to CREDENTIAL_PROVIDER_DEFAULT_DISALLOWED.
  CREDENTIAL_PROVIDER_POLICY_DEFAULT_UNSPECIFIED = 0;

  // Apps with credentialProviderPolicy unspecified are not allowed to act as a credential provider.
  CREDENTIAL_PROVIDER_DEFAULT_DISALLOWED = 1;

  // Apps with credentialProviderPolicy unspecified are not allowed to act as a credential provider
  // except for the OEM default credential providers. OEM default credential providers are always
  // allowed to act as credential providers.
  CREDENTIAL_PROVIDER_DEFAULT_DISALLOWED_EXCEPT_SYSTEM = 2;

  // Apps with credentialProviderPolicy unspecified are allowed to act as a credential provider.
  CREDENTIAL_PROVIDER_DEFAULT_ALLOWED = 3;
}

// Advanced security settings. In most cases, setting these is not needed.
message AdvancedSecurityOverrides {
  enum UntrustedAppsPolicy {
    // Unspecified. Defaults to DISALLOW_INSTALL.
    UNTRUSTED_APPS_POLICY_UNSPECIFIED = 0;

    // Default. Disallow untrusted app installs on entire device.
    DISALLOW_INSTALL = 1;

    // Allow untrusted app installs on entire device.
    ALLOW_INSTALL_DEVICE_WIDE = 2;
  }
  enum GooglePlayProtectVerifyApps {
    // Unspecified. Defaults to VERIFY_APPS_ENFORCED.
    GOOGLE_PLAY_PROTECT_VERIFY_APPS_UNSPECIFIED = 0;

    // Default. Force-enables app verification.
    VERIFY_APPS_ENFORCED = 1;

    // Allows the user to choose whether to enable app verification.
    VERIFY_APPS_USER_CHOICE = 2;
  }
  enum DeveloperSettings {
    // Unspecified. Defaults to DEVELOPER_SETTINGS_DISABLED.
    DEVELOPER_SETTINGS_UNSPECIFIED = 0;

    // Default. Disables all developer settings and prevents the user from accessing them.
    DEVELOPER_SETTINGS_DISABLED = 1;

    // Allows all developer settings. The user can access and optionally configure the settings.
    DEVELOPER_SETTINGS_ALLOWED = 2;
  }
  enum CommonCriteriaMode {
    // Unspecified. Defaults to COMMON_CRITERIA_MODE_DISABLED.
    COMMON_CRITERIA_MODE_UNSPECIFIED = 0;

    // Default. Disables Common Criteria Mode.
    COMMON_CRITERIA_MODE_DISABLED = 1;

    // Enables Common Criteria Mode.
    COMMON_CRITERIA_MODE_ENABLED = 2;
  }

  // The policy for untrusted apps (apps from unknown sources) enforced on the device. Replaces
  // install_unknown_sources_allowed (deprecated).
  UntrustedAppsPolicy untrusted_apps_policy = 1;

  // Whether Google Play Protect verification (https://support.google.com/accounts/answer/2812853)
  // is enforced. Replaces ensureVerifyAppsEnabled (deprecated).
  GooglePlayProtectVerifyApps google_play_protect_verify_apps = 2;

  // Controls access to developer settings: developer options and safe boot. Replaces
  // safeBootDisabled (deprecated) and debuggingFeaturesAllowed (deprecated). On personally-owned
  // devices with a work profile, setting this policy will not disable safe boot. In this case, a
  // NonComplianceDetail with MANAGEMENT_MODE is reported.
  DeveloperSettings developer_settings = 3;

  // Controls Common Criteria Mode—security standards defined in the Common Criteria for Information
  // Technology Security Evaluation (https://www.commoncriteriaportal.org/) (CC). Enabling Common
  // Criteria Mode increases certain security components on a device, see CommonCriteriaMode for
  // details.Warning: Common Criteria Mode enforces a strict security model typically only required
  // for IT products used in national security systems and other highly sensitive organizations.
  // Standard device use may be affected. Only enabled if required. If Common Criteria Mode is
  // turned off after being enabled previously, all user-configured Wi-Fi networks may be lost and
  // any enterprise-configured Wi-Fi networks that require user input may need to be reconfigured.
  CommonCriteriaMode common_criteria_mode = 4;
}

// Controls for device radio settings.
message DeviceRadioState {
  enum WifiState {
    // Unspecified. Defaults to WIFI_STATE_USER_CHOICE
    WIFI_STATE_UNSPECIFIED = 0;

    // User is allowed to enable/disable Wi-Fi.
    WIFI_STATE_USER_CHOICE = 1;

    // Wi-Fi is on and the user is not allowed to turn it off. A NonComplianceDetail with API_LEVEL
    // is reported if the Android version is less than 13.
    WIFI_ENABLED = 2;

    // Wi-Fi is off and the user is not allowed to turn it on. A NonComplianceDetail with API_LEVEL
    // is reported if the Android version is less than 13.
    WIFI_DISABLED = 3;
  }
  enum AirplaneModeState {
    // Unspecified. Defaults to AIRPLANE_MODE_USER_CHOICE.
    AIRPLANE_MODE_STATE_UNSPECIFIED = 0;

    // The user is allowed to toggle airplane mode on or off.
    AIRPLANE_MODE_USER_CHOICE = 1;

    // Airplane mode is disabled. The user is not allowed to toggle airplane mode on. A
    // NonComplianceDetail with API_LEVEL is reported if the Android version is less than 9.
    AIRPLANE_MODE_DISABLED = 2;
  }
  enum UltraWidebandState {
    // Unspecified. Defaults to ULTRA_WIDEBAND_USER_CHOICE.
    ULTRA_WIDEBAND_STATE_UNSPECIFIED = 0;

    // The user is allowed to toggle ultra wideband on or off.
    ULTRA_WIDEBAND_USER_CHOICE = 1;

    // Ultra wideband is disabled. The user is not allowed to toggle ultra wideband on via settings.
    // A NonComplianceDetail with API_LEVEL is reported if the Android version is less than 14.
    ULTRA_WIDEBAND_DISABLED = 2;
  }
  enum CellularTwoGState {
    // Unspecified. Defaults to CELLULAR_TWO_G_USER_CHOICE.
    CELLULAR_TWO_G_STATE_UNSPECIFIED = 0;

    // The user is allowed to toggle cellular 2G on or off.
    CELLULAR_TWO_G_USER_CHOICE = 1;

    // Cellular 2G is disabled. The user is not allowed to toggle cellular 2G on via settings. A
    // NonComplianceDetail with API_LEVEL is reported if the Android version is less than 14.
    CELLULAR_TWO_G_DISABLED = 2;
  }
  enum MinimumWifiSecurityLevel {
    // The device will be able to connect to all types of Wi-Fi networks.
    OPEN_NETWORK_SECURITY = 0;

    // A personal network such as WEP, WPA2-PSK is the minimum required security. The device will
    // not be able to connect to open wifi networks. This is stricter than OPEN_NETWORK_SECURITY. A
    // NonComplianceDetail with API_LEVEL is reported if the Android version is less than 13.
    PERSONAL_NETWORK_SECURITY = 1;

    // An enterprise EAP network is the minimum required security level. The device will not be able
    // to connect to Wi-Fi network below this security level. This is stricter than
    // PERSONAL_NETWORK_SECURITY. A NonComplianceDetail with API_LEVEL is reported if the Android
    // version is less than 13.
    ENTERPRISE_NETWORK_SECURITY = 2;

    // A 192-bit enterprise network is the minimum required security level. The device will not be
    // able to connect to Wi-Fi network below this security level. This is stricter than
    // ENTERPRISE_NETWORK_SECURITY. A NonComplianceDetail with API_LEVEL is reported if the Android
    // version is less than 13.
    ENTERPRISE_BIT192_NETWORK_SECURITY = 3;
  }

  // Optional. Controls current state of Wi-Fi and if user can change its state.
  WifiState wifi_state = 1;

  // Optional. Controls whether airplane mode can be toggled by the user or not.
  AirplaneModeState airplane_mode_state = 2;

  // Optional. Controls the state of the ultra wideband setting and whether the user can toggle it
  // on or off.
  UltraWidebandState ultra_wideband_state = 3;

  // Optional. Controls whether cellular 2G setting can be toggled by the user or not.
  CellularTwoGState cellular_two_g_state = 4;

  // Optional. The minimum required security level of Wi-Fi networks that the device can connect to.
  MinimumWifiSecurityLevel minimum_wifi_security_level = 5;
}

// Represents a Wi-Fi SSID.
message WifiSsid {
  // Required. Wi-Fi SSID represented as a string.
  string wifi_ssid = 1;
}

// Restrictions on which Wi-Fi SSIDs the device can connect to. Note that this does not affect which
// networks can be configured on the device. Supported on company-owned devices running Android 13
// and above.
message WifiSsidPolicy {
  enum WifiSsidPolicyType {
    // Defaults to WIFI_SSID_DENYLIST. wifiSsids must not be set. There are no restrictions on which
    // SSID the device can connect to.
    WIFI_SSID_POLICY_TYPE_UNSPECIFIED = 0;

    // The device cannot connect to any Wi-Fi network whose SSID is in wifiSsids, but can connect to
    // other networks.
    WIFI_SSID_DENYLIST = 1;

    // The device can make Wi-Fi connections only to the SSIDs in wifiSsids. wifiSsids must not be
    // empty. The device will not be able to connect to any other Wi-Fi network.
    WIFI_SSID_ALLOWLIST = 2;
  }
  // Type of the Wi-Fi SSID policy to be applied.
  WifiSsidPolicyType wifi_ssid_policy_type = 1;

  // Optional. List of Wi-Fi SSIDs that should be applied in the policy. This field must be non-
  // empty when WifiSsidPolicyType is set to WIFI_SSID_ALLOWLIST. If this is set to a non-empty
  // list, then a NonComplianceDetail detail with API_LEVEL is reported if the Android version is
  // less than 13 and a NonComplianceDetail with MANAGEMENT_MODE is reported for non-company-owned
  // devices.
  repeated WifiSsid wifi_ssids = 2;
}

// Covers controls for device connectivity such as Wi-Fi, USB data access, keyboard/mouse
