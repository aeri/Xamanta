    // work profiles on company-owned devices. If the setting is not supported,
    // ALLOW_CONFIGURING_WIFI is set. A NonComplianceDetail with API_LEVEL is reported if the
    // Android version is less than 13. wifiConfigDisabled is ignored.
    DISALLOW_ADD_WIFI_CONFIG = 2;

    // Disallows configuring Wi-Fi networks. The setting wifiConfigDisabled is ignored when this
