    // work profiles on company-owned devices, existing configured networks are not affected and the
    // user is not allowed to add, remove, or modify Wi-Fi networks. Note: If a network connection
    // can't be made at boot time and configuring Wi-Fi is disabled then network escape hatch will
    // be shown in order to refresh the device policy (see networkEscapeHatchEnabled).
    DISALLOW_CONFIGURING_WIFI = 3;
  }
  enum WifiDirectSettings {
    // Unspecified. Defaults to ALLOW_WIFI_DIRECT
    WIFI_DIRECT_SETTINGS_UNSPECIFIED = 0;

    // The user is allowed to use Wi-Fi direct.
    ALLOW_WIFI_DIRECT = 1;

    // The user is not allowed to use Wi-Fi direct. A NonComplianceDetail with API_LEVEL is reported
    // if the Android version is less than 13.
    DISALLOW_WIFI_DIRECT = 2;
  }
  enum TetheringSettings {
    // Unspecified. Defaults to ALLOW_ALL_TETHERING unless tetheringConfigDisabled is set to true.
    // If tetheringConfigDisabled is set to true, this is equivalent to DISALLOW_ALL_TETHERING.
    TETHERING_SETTINGS_UNSPECIFIED = 0;

    // Allows configuration and use of all forms of tethering. tetheringConfigDisabled is ignored.
    ALLOW_ALL_TETHERING = 1;

    // Disallows the user from using Wi-Fi tethering. Supported on company owned devices running
    // Android 13 and above. If the setting is not supported, ALLOW_ALL_TETHERING will be set. A
    // NonComplianceDetail with API_LEVEL is reported if the Android version is less than 13.
    // tetheringConfigDisabled is ignored.
    DISALLOW_WIFI_TETHERING = 2;

    // Disallows all forms of tethering. Supported on fully managed devices and work profile on
    // company-owned devices, on all supported android versions. The setting tetheringConfigDisabled
    // is ignored.
    DISALLOW_ALL_TETHERING = 3;
  }
  enum BluetoothSharing {
    // Unspecified. Defaults to BLUETOOTH_SHARING_DISALLOWED on work profiles and
    // BLUETOOTH_SHARING_ALLOWED on fully managed devices.
    BLUETOOTH_SHARING_UNSPECIFIED = 0;

    // Bluetooth sharing is allowed.Supported on Android 8 and above. A NonComplianceDetail with
    // API_LEVEL is reported on work profiles if the Android version is less than 8.
    BLUETOOTH_SHARING_ALLOWED = 1;

    // Bluetooth sharing is disallowed.Supported on Android 8 and above. A NonComplianceDetail with
    // API_LEVEL is reported on fully managed devices if the Android version is less than 8.
    BLUETOOTH_SHARING_DISALLOWED = 2;
  }

  // Controls what files and/or data can be transferred via USB. Supported only on company-owned
  // devices.
  UsbDataAccess usb_data_access = 1;

  // Controls Wi-Fi configuring privileges. Based on the option set, user will have either full or
  // limited or no control in configuring Wi-Fi networks.
  ConfigureWifi configure_wifi = 2;

  // Controls configuring and using Wi-Fi direct settings. Supported on company-owned devices
  // running Android 13 and above.
  WifiDirectSettings wifi_direct_settings = 3;

  // Controls tethering settings. Based on the value set, the user is partially or fully disallowed
  // from using different forms of tethering.
  TetheringSettings tethering_settings = 4;

  // Restrictions on which Wi-Fi SSIDs the device can connect to. Note that this does not affect
  // which networks can be configured on the device. Supported on company-owned devices running
  // Android 13 and above.
  WifiSsidPolicy wifi_ssid_policy = 5;

  // Optional. Wi-Fi roaming policy.
  WifiRoamingPolicy wifi_roaming_policy = 6;

  // Optional. Controls whether Bluetooth sharing is allowed.
  BluetoothSharing bluetooth_sharing = 7;

  // Optional. Access Point Name (APN) policy. Configuration for Access Point Names (APNs) which may
  // override any other APNs on the device. See OVERRIDE_APNS_ENABLED and overrideApns for details.
  ApnPolicy apn_policy = 8;

  // Optional. The global private DNS settings.
  PrivateDnsSettings private_dns_settings = 9;

  // Optional. Preferential network service configuration. Setting this field will override
  // preferentialNetworkService. This can be set on both work profiles and fully managed devices on
  // Android 13 and above. See 5G network slicing
  // (https://developers.google.com/android/management/5g-network-slicing) guide for more details.
  PreferentialNetworkServiceSettings preferential_network_service_settings = 10;
}

// Wi-Fi roaming policy.
message WifiRoamingPolicy {
  // Optional. Wi-Fi roaming settings. SSIDs provided in this list must be unique, the policy will
  // be rejected otherwise.
  repeated WifiRoamingSetting wifi_roaming_settings = 1;
}

// Wi-Fi roaming setting.
message WifiRoamingSetting {
  enum WifiRoamingMode {
    // Unspecified. Defaults to WIFI_ROAMING_DEFAULT.
    WIFI_ROAMING_MODE_UNSPECIFIED = 0;

    // Wi-Fi roaming is disabled. Supported on Android 15 and above on fully managed devices and
    // work profiles on company-owned devices. A NonComplianceDetail with MANAGEMENT_MODE is
    // reported for other management modes. A NonComplianceDetail with API_LEVEL is reported if the
    // Android version is less than 15.
    WIFI_ROAMING_DISABLED = 1;

    // Default Wi-Fi roaming mode of the device.
    WIFI_ROAMING_DEFAULT = 2;

    // Aggressive roaming mode which allows quicker Wi-Fi roaming. Supported on Android 15 and above
    // on fully managed devices and work profiles on company-owned devices. A NonComplianceDetail
    // with MANAGEMENT_MODE is reported for other management modes. A NonComplianceDetail with
    // API_LEVEL is reported if the Android version is less than 15. A NonComplianceDetail with
    // DEVICE_INCOMPATIBLE is reported if the device does not support aggressive roaming mode.
    WIFI_ROAMING_AGGRESSIVE = 3;
  }
  // Required. SSID of the Wi-Fi network.
  string wifi_ssid = 1;

  // Required. Wi-Fi roaming mode for the specified SSID.
  WifiRoamingMode wifi_roaming_mode = 2;
}

// Controls the device's private DNS settings.
message PrivateDnsSettings {
  enum PrivateDnsMode {
    // Unspecified. Defaults to PRIVATE_DNS_USER_CHOICE.
    PRIVATE_DNS_MODE_UNSPECIFIED = 0;

    // The user is allowed to configure private DNS.
    PRIVATE_DNS_USER_CHOICE = 1;

    // Automatic private DNS mode. The device tries to use the network-provided DNS server over an
    // encrypted connection before resorting to cleartext. The user is not allowed to modify this
    // setting. Supported on Android 10 and above on fully managed devices and work profiles on
    // company-owned devices. A NonComplianceDetail with MANAGEMENT_MODE is reported on other
    // management modes. A NonComplianceDetail with API_LEVEL is reported if the Android version is
    // less than 10. A NonComplianceDetail with INVALID_VALUE is reported if setting this fails for
    // any other reason.Note: For work profiles on company-owned devices, setting this mode prevents
    // the user from changing the setting, but the active private DNS setting is not modified. A
    // NonComplianceDetail with MANAGEMENT_MODE is reported in this case.
    PRIVATE_DNS_AUTOMATIC = 2;

    // The device only uses the DNS server specified in private_dns_host. The user is not allowed to
    // modify this setting. If this is set, then private_dns_host must be set. Supported on Android
    // 10 and above on fully managed devices. A NonComplianceDetail with MANAGEMENT_MODE is reported
    // on other management modes. A NonComplianceDetail with API_LEVEL is reported if the Android
    // version is less than 10.
    PRIVATE_DNS_SPECIFIED_HOST = 3;
  }
  // Optional. The configuration mode for device's global private DNS settings. If this is set to
  // PRIVATE_DNS_SPECIFIED_HOST, then private_dns_host must be set.
  PrivateDnsMode private_dns_mode = 1;

  // Optional. The hostname of the DNS server. This must be set if and only if private_dns_mode is
  // set to PRIVATE_DNS_SPECIFIED_HOST. Supported on Android 10 and above on fully managed devices.
  // A NonComplianceDetail with MANAGEMENT_MODE is reported on other management modes. A
  // NonComplianceDetail with API_LEVEL is reported if the Android version is less than 10. A
  // NonComplianceDetail with PENDING is reported if the device is not connected to a network. A
  // NonComplianceDetail with nonComplianceReason INVALID_VALUE and specificNonComplianceReason
  // PRIVATE_DNS_HOST_NOT_SERVING is reported if the specified host is not a DNS server or not
  // supported on Android. A NonComplianceDetail with INVALID_VALUE is reported if applying this
  // setting fails for any other reason.
  string private_dns_host = 2;
}

enum PreferentialNetworkService {
  // Unspecified. Defaults to PREFERENTIAL_NETWORK_SERVICES_DISABLED.
  PREFERENTIAL_NETWORK_SERVICE_UNSPECIFIED = 0;

  // Preferential network service is disabled on the work profile.
  PREFERENTIAL_NETWORK_SERVICE_DISABLED = 1;

  // Preferential network service is enabled on the work profile. This setting is only supported on
  // work profiles on devices running Android 12 or above. Starting with Android 13, fully managed
  // devices are also supported.
  PREFERENTIAL_NETWORK_SERVICE_ENABLED = 2;
}

// Preferential network service settings.
message PreferentialNetworkServiceSettings {
  // Required. Default preferential network ID for the applications that are not in applications or
  // if ApplicationPolicy.preferentialNetworkId is set to PREFERENTIAL_NETWORK_ID_UNSPECIFIED. There
  // must be a configuration for the specified network ID in preferentialNetworkServiceConfigs,
  // unless this is set to NO_PREFERENTIAL_NETWORK. If set to PREFERENTIAL_NETWORK_ID_UNSPECIFIED or
  // unset, this defaults to NO_PREFERENTIAL_NETWORK. Note: If the default preferential network is
  // misconfigured, applications with no ApplicationPolicy.preferentialNetworkId set are not able to
  // access the internet. This setting does not apply to the following critical apps:
  // com.google.android.apps.work.clouddpc
  // com.google.android.gmsApplicationPolicy.preferentialNetworkId can still be used to configure
  // the preferential network for them.
  PreferentialNetworkId default_preferential_network_id = 1;

  // Required. Preferential network service configurations which enables having multiple enterprise
  // slices. There must not be multiple configurations with the same preferentialNetworkId. If a
  // configuration is not referenced by any application by setting
  // ApplicationPolicy.preferentialNetworkId or by setting defaultPreferentialNetworkId, it will be
  // ignored. For devices on 4G networks, enterprise APN needs to be configured additionally to set
  // up data call for preferential network service. These APNs can be added using apnPolicy.
  repeated PreferentialNetworkServiceConfig preferential_network_service_configs = 2;
}

// Individual preferential network service configuration.
message PreferentialNetworkServiceConfig {
  enum NonMatchingNetworks {
    // Unspecified. Defaults to NON_MATCHING_NETWORKS_ALLOWED.
    NON_MATCHING_NETWORKS_UNSPECIFIED = 0;

    // Apps this configuration applies to are allowed to use networks other than the preferential
    // service.
    NON_MATCHING_NETWORKS_ALLOWED = 1;

    // Apps this configuration applies to are disallowed from using other networks than the
    // preferential service. This can be set on Android 14 and above. A NonComplianceDetail with
    // API_LEVEL is reported if the Android version is less than 14. If this is set,
    // fallbackToDefaultConnection must be set to FALLBACK_TO_DEFAULT_CONNECTION_DISALLOWED, the
    // policy will be rejected otherwise.
    NON_MATCHING_NETWORKS_DISALLOWED = 2;
  }
  enum FallbackToDefaultConnection {
    // Unspecified. Defaults to FALLBACK_TO_DEFAULT_CONNECTION_ALLOWED.
    FALLBACK_TO_DEFAULT_CONNECTION_UNSPECIFIED = 0;

    // Fallback to default connection is allowed. If this is set, nonMatchingNetworks must not be
    // set to NON_MATCHING_NETWORKS_DISALLOWED, the policy will be rejected otherwise.
    FALLBACK_TO_DEFAULT_CONNECTION_ALLOWED = 1;

    // Fallback to default connection is not allowed.
    FALLBACK_TO_DEFAULT_CONNECTION_DISALLOWED = 2;
  }
  // Required. Preferential network identifier. This must not be set to NO_PREFERENTIAL_NETWORK or
  // PREFERENTIAL_NETWORK_ID_UNSPECIFIED, the policy will be rejected otherwise.
  PreferentialNetworkId preferential_network_id = 1;

  // Optional. Whether apps this configuration applies to are blocked from using networks other than
  // the preferential service. If this is set to NON_MATCHING_NETWORKS_DISALLOWED, then
  // fallbackToDefaultConnection must be set to FALLBACK_TO_DEFAULT_CONNECTION_DISALLOWED.
  NonMatchingNetworks non_matching_networks = 2;

  // Optional. Whether fallback to the device-wide default network is allowed. If this is set to
  // FALLBACK_TO_DEFAULT_CONNECTION_ALLOWED, then nonMatchingNetworks must not be set to
  // NON_MATCHING_NETWORKS_DISALLOWED, the policy will be rejected otherwise. Note: If this is set
  // to FALLBACK_TO_DEFAULT_CONNECTION_DISALLOWED, applications are not able to access the internet
  // if the 5G slice is not available.
  FallbackToDefaultConnection fallback_to_default_connection = 3;
}

enum PreferentialNetworkId {
  // Whether this value is valid and what it means depends on where it is used, and this is
  // documented on the relevant fields.
  PREFERENTIAL_NETWORK_ID_UNSPECIFIED = 0;

  // Application does not use any preferential network.
  NO_PREFERENTIAL_NETWORK = 1;

  // Preferential network identifier 1.
  PREFERENTIAL_NETWORK_ID_ONE = 2;

  // Preferential network identifier 2.
  PREFERENTIAL_NETWORK_ID_TWO = 3;

  // Preferential network identifier 3.
  PREFERENTIAL_NETWORK_ID_THREE = 4;

  // Preferential network identifier 4.
  PREFERENTIAL_NETWORK_ID_FOUR = 5;

  // Preferential network identifier 5.
  PREFERENTIAL_NETWORK_ID_FIVE = 6;
}

// Access Point Name (APN) policy. Configuration for Access Point Names (APNs) which may override
// any other APNs on the device. See OVERRIDE_APNS_ENABLED and overrideApns for details.
message ApnPolicy {
  enum OverrideApns {
    // Unspecified. Defaults to OVERRIDE_APNS_DISABLED.
    OVERRIDE_APNS_UNSPECIFIED = 0;

    // Override APNs disabled. Any configured apnSettings are saved on the device, but are disabled
    // and have no effect. Any other APNs on the device remain in use.
    OVERRIDE_APNS_DISABLED = 1;

    // Override APNs enabled. Only override APNs are in use, any other APNs are ignored. This can
    // only be set on fully managed devices on Android 10 and above. For work profiles override APNs
    // are enabled via preferentialNetworkServiceSettings and this value cannot be set. A
    // NonComplianceDetail with API_LEVEL is reported if the Android version is less than 10. A
    // NonComplianceDetail with MANAGEMENT_MODE is reported for work profiles.
    OVERRIDE_APNS_ENABLED = 2;
  }
  // Optional. Whether override APNs are disabled or enabled. See
  // DevicePolicyManager.setOverrideApnsEnabled (https://developer.android.com/reference/android/app
  // /admin/DevicePolicyManager#setOverrideApnsEnabled) for more details.
  OverrideApns override_apns = 1;

  // Optional. APN settings for override APNs. There must not be any conflict between any of APN
  // settings provided, otherwise the policy will be rejected. Two ApnSettings are considered to
  // conflict when all of the following fields match on both: numericOperatorId, apn, proxyAddress,
  // proxyPort, mmsProxyAddress, mmsProxyPort, mmsc, mvnoType, protocol, roamingProtocol. If some of
  // the APN settings result in non-compliance of INVALID_VALUE , they will be ignored. This can be
  // set on fully managed devices on Android 10 and above. This can also be set on work profiles on
  // Android 13 and above and only with ApnSetting's with ENTERPRISE APN type. A NonComplianceDetail
  // with API_LEVEL is reported if the Android version is less than 10. A NonComplianceDetail with
  // MANAGEMENT_MODE is reported for work profiles on Android versions less than 13.
  repeated ApnSetting apn_settings = 2;
}

// An Access Point Name (APN) configuration for a carrier data connection. The APN provides
// configuration to connect a cellular network device to an IP data network. A carrier uses this
// setting to decide which IP address to assign, any security methods to apply, and how the device
// might be connected to private networks.
message ApnSetting {
  enum Protocol {
    // The protocol is not specified.
    PROTOCOL_UNSPECIFIED = 0;

    // Internet protocol.
    IP = 1;

    // Virtual PDP type introduced to handle dual IP stack UE capability.
    IPV4V6 = 2;

    // Internet protocol, version 6.
    IPV6 = 3;

    // Transfer of Non-IP data to external packet data network.
    NON_IP = 4;

    // Point to point protocol.
    PPP = 5;

    // Transfer of Unstructured data to the Data Network via N6.
    UNSTRUCTURED = 6;
  }
  enum ApnType {
    // Unspecified. This value is not used.
    APN_TYPE_UNSPECIFIED = 0;

    // APN type for enterprise traffic. Supported on Android 13 and above. A NonComplianceDetail
    // with API_LEVEL is reported if the Android version is less than 13.
    ENTERPRISE = 1;

    // APN type for BIP (Bearer Independent Protocol). This can only be set on fully managed devices
    // on Android 12 and above. A NonComplianceDetail with API_LEVEL is reported if the Android
    // version is less than 12. A NonComplianceDetail with MANAGEMENT_MODE is reported for work
    // profiles.
    BIP = 2;

    // APN type for CBS (Carrier Branded Services). This can only be set on fully managed devices. A
    // NonComplianceDetail with MANAGEMENT_MODE is reported for work profiles.
    CBS = 3;

    // APN type for default data traffic. This can only be set on fully managed devices. A
    // NonComplianceDetail with MANAGEMENT_MODE is reported for work profiles.
    DEFAULT = 4;

    // APN type for DUN (Dial-up networking) traffic. This can only be set on fully managed devices.
    // A NonComplianceDetail with MANAGEMENT_MODE is reported for work profiles.
    DUN = 5;

    // APN type for Emergency PDN. This is not an IA apn, but is used for access to carrier services
    // in an emergency call situation. This can only be set on fully managed devices. A
    // NonComplianceDetail with MANAGEMENT_MODE is reported for work profiles.
    EMERGENCY = 6;

    // APN type for accessing the carrier's FOTA (Firmware Over-the-Air) portal, used for over the
    // air updates. This can only be set on fully managed devices. A NonComplianceDetail with
    // MANAGEMENT_MODE is reported for work profiles.
    FOTA = 7;

    // APN type for HiPri (high-priority) traffic. This can only be set on fully managed devices. A
    // NonComplianceDetail with MANAGEMENT_MODE is reported for work profiles.
    HIPRI = 8;

    // APN type for IA (Initial Attach) APN. This can only be set on fully managed devices. A
    // NonComplianceDetail with MANAGEMENT_MODE is reported for work profiles.
    IA = 9;

    // APN type for IMS (IP Multimedia Subsystem) traffic. This can only be set on fully managed
    // devices. A NonComplianceDetail with MANAGEMENT_MODE is reported for work profiles.
    IMS = 10;

    // APN type for MCX (Mission Critical Service) where X can be PTT/Video/Data. This can only be
    // set on fully managed devices. A NonComplianceDetail with MANAGEMENT_MODE is reported for work
    // profiles.
    MCX = 11;

    // APN type for MMS (Multimedia Messaging Service) traffic. This can only be set on fully
    // managed devices. A NonComplianceDetail with MANAGEMENT_MODE is reported for work profiles.
    MMS = 12;

    // APN type for RCS (Rich Communication Services). This can only be set on fully managed devices
    // on Android 15 and above. A NonComplianceDetail with API_LEVEL is reported if the Android
    // version is less than 15. A NonComplianceDetail with MANAGEMENT_MODE is reported for work
    // profiles.
    RCS = 13;

    // APN type for SUPL (Secure User Plane Location) assisted GPS. This can only be set on fully
    // managed devices. A NonComplianceDetail with MANAGEMENT_MODE is reported for work profiles.
    SUPL = 14;

    // APN type for VSIM (Virtual SIM) service. This can only be set on fully managed devices on
    // Android 12 and above. A NonComplianceDetail with API_LEVEL is reported if the Android version
    // is less than 12. A NonComplianceDetail with MANAGEMENT_MODE is reported for work profiles.
    VSIM = 15;

    // APN type for XCAP (XML Configuration Access Protocol) traffic. This can only be set on fully
    // managed devices on Android 11 and above. A NonComplianceDetail with API_LEVEL is reported if
    // the Android version is less than 11. A NonComplianceDetail with MANAGEMENT_MODE is reported
    // for work profiles.
    XCAP = 16;
  }
  enum AuthType {
    // Unspecified. If username is empty, defaults to NONE. Otherwise, defaults to PAP_OR_CHAP.
    AUTH_TYPE_UNSPECIFIED = 0;

    // Authentication is not required.
    NONE = 1;

    // Authentication type for PAP.
    PAP = 2;

    // Authentication type for CHAP.
    CHAP = 3;

    // Authentication type for PAP or CHAP.
    PAP_OR_CHAP = 4;
  }
  enum MvnoType {
    // The MVNO type is not specified.
    MVNO_TYPE_UNSPECIFIED = 0;

    // MVNO type for group identifier level 1.
    GID = 1;

    // MVNO type for ICCID.
    ICCID = 2;

    // MVNO type for IMSI.
    IMSI = 3;

    // MVNO type for SPN (service provider name).
    SPN = 4;
  }
  enum NetworkType {
    // Unspecified. This value must not be used.
    NETWORK_TYPE_UNSPECIFIED = 0;

    // Radio technology EDGE.
    EDGE = 1;

    // Radio technology GPRS.
    GPRS = 2;

    // Radio technology GSM.
    GSM = 3;

    // Radio technology HSDPA.
    HSDPA = 4;

    // Radio technology HSPA.
    HSPA = 5;

    // Radio technology HSPAP.
    HSPAP = 6;

    // Radio technology HSUPA.
    HSUPA = 7;

    // Radio technology IWLAN.
    IWLAN = 8;

    // Radio technology LTE.
    LTE = 9;

    // Radio technology NR (New Radio) 5G.
    NR = 10;

    // Radio technology TD_SCDMA.
    TD_SCDMA = 11;

    // Radio technology UMTS.
    UMTS = 12;
  }
  enum AlwaysOnSetting {
    // Unspecified. Defaults to NOT_ALWAYS_ON.
    ALWAYS_ON_SETTING_UNSPECIFIED = 0;

    // The PDU session brought up by this APN should not be always on.
    NOT_ALWAYS_ON = 1;

    // The PDU session brought up by this APN should always be on. Supported on Android 15 and
    // above. A NonComplianceDetail with API_LEVEL is reported if the Android version is less than
    // 15.
    ALWAYS_ON = 2;
  }

  // Required. Name of the APN. Policy will be rejected if this field is empty.
  string apn = 1;

  // Required. Human-readable name that describes the APN. Policy will be rejected if this field is
  // empty.
  string display_name = 2;

  // Required. Usage categories for the APN. Policy will be rejected if this field is empty or
  // contains APN_TYPE_UNSPECIFIED or duplicates. Multiple APN types can be set on fully managed
  // devices. ENTERPRISE is the only allowed APN type on work profiles. A NonComplianceDetail with
  // MANAGEMENT_MODE is reported for any other value on work profiles. APN types that are not
  // supported on the device or management mode will be ignored. If this results in the empty list,
  // the APN setting will be ignored, because apnTypes is a required field. A NonComplianceDetail
  // with INVALID_VALUE is reported if none of the APN types are supported on the device or
  // management mode.
  repeated ApnType apn_types = 3;

  // Optional. The protocol to use to connect to this APN.
  Protocol protocol = 4;

  // Optional. The protocol to use to connect to this APN while the device is roaming.
  Protocol roaming_protocol = 5;

  // Optional. Authentication type of the APN.
  AuthType auth_type = 6;

  // Optional. APN username of the APN.
  string username = 7;

  // Optional. APN password of the APN.
  string password = 8;

  // Optional. MMSC (Multimedia Messaging Service Center) URI of the APN.
  string mmsc = 9;

  // Optional. MMS (Multimedia Messaging Service) proxy address of the APN which can be an IP
  // address or hostname (not a URL).
  string mms_proxy_address = 10;

  // Optional. MMS (Multimedia Messaging Service) proxy port of the APN. A value of 0 (default)
  // means not set and negative values are rejected.
  int32 mms_proxy_port = 11;

  // Optional. The proxy address of the APN.
  string proxy_address = 12;

  // Optional. The proxy port of the APN. A value of 0 (default) means not set and negative values
  // are rejected.
  int32 proxy_port = 13;

  // Optional. MVNO match type for the APN.
  MvnoType mvno_type = 14;

  // Optional. The numeric operator ID of the APN. Numeric operator ID is defined as MCC (Mobile
  // Country Code) + MNC (Mobile Network Code).
  string numeric_operator_id = 15;

  // Optional. Carrier ID for the APN. A value of 0 (default) means not set and negative values are
  // rejected.
  int32 carrier_id = 16;

  // Optional. Radio technologies (network types) the APN may use. Policy will be rejected if this
  // field contains NETWORK_TYPE_UNSPECIFIED or duplicates.
  repeated NetworkType network_types = 17;

  // Optional. The default MTU (Maximum Transmission Unit) size in bytes of the IPv4 routes brought
  // up by this APN setting. A value of 0 (default) means not set and negative values are rejected.
  // Supported on Android 13 and above. A NonComplianceDetail with API_LEVEL is reported if the
  // Android version is less than 13.
  int32 mtu_v4 = 18;

  // Optional. The MTU (Maximum Transmission Unit) size of the IPv6 mobile interface to which the
  // APN connected. A value of 0 (default) means not set and negative values are rejected. Supported
  // on Android 13 and above. A NonComplianceDetail with API_LEVEL is reported if the Android
  // version is less than 13.
  int32 mtu_v6 = 19;

  // Optional. Whether User Plane resources have to be activated during every transition from CM-
  // IDLE mode to CM-CONNECTED state for this APN. See 3GPP TS 23.501 section 5.6.13.
  AlwaysOnSetting always_on_setting = 20;
}

// Controls for the display settings.
message DisplaySettings {
  // Controls for the screen brightness settings.
  message ScreenBrightnessSettings {
    enum ScreenBrightnessMode {
      // Unspecified. Defaults to BRIGHTNESS_USER_CHOICE.
      SCREEN_BRIGHTNESS_MODE_UNSPECIFIED = 0;

      // The user is allowed to configure the screen brightness. screenBrightness must not be set.
      BRIGHTNESS_USER_CHOICE = 1;

      // The screen brightness mode is automatic in which the brightness is automatically adjusted
      // and the user is not allowed to configure the screen brightness. screenBrightness can still
      // be set and it is taken into account while the brightness is automatically adjusted.
      // Supported on Android 9 and above on fully managed devices. A NonComplianceDetail with
      // API_LEVEL is reported if the Android version is less than 9. Supported on work profiles on
      // company-owned devices on Android 15 and above.
      BRIGHTNESS_AUTOMATIC = 2;

      // The screen brightness mode is fixed in which the brightness is set to screenBrightness and
      // the user is not allowed to configure the screen brightness. screenBrightness must be set.
      // Supported on Android 9 and above on fully managed devices. A NonComplianceDetail with
      // API_LEVEL is reported if the Android version is less than 9. Supported on work profiles on
      // company-owned devices on Android 15 and above.
      BRIGHTNESS_FIXED = 3;
    }
    // Optional. Controls the screen brightness mode.
    ScreenBrightnessMode screen_brightness_mode = 1;

    // Optional. The screen brightness between 1 and 255 where 1 is the lowest and 255 is the
    // highest brightness. A value of 0 (default) means no screen brightness set. Any other value is
    // rejected. screenBrightnessMode must be either BRIGHTNESS_AUTOMATIC or BRIGHTNESS_FIXED to set
    // this. Supported on Android 9 and above on fully managed devices. A NonComplianceDetail with
    // API_LEVEL is reported if the Android version is less than 9. Supported on work profiles on
    // company-owned devices on Android 15 and above.
    int32 screen_brightness = 2;
  }
  // Controls the screen timeout settings.
  message ScreenTimeoutSettings {
    enum ScreenTimeoutMode {
      // Unspecified. Defaults to SCREEN_TIMEOUT_USER_CHOICE.
      SCREEN_TIMEOUT_MODE_UNSPECIFIED = 0;

      // The user is allowed to configure the screen timeout. screenTimeout must not be set.
      SCREEN_TIMEOUT_USER_CHOICE = 1;

      // The screen timeout is set to screenTimeout and the user is not allowed to configure the
      // timeout. screenTimeout must be set. Supported on Android 9 and above on fully managed
      // devices. A NonComplianceDetail with API_LEVEL is reported if the Android version is less
      // than 9. Supported on work profiles on company-owned devices on Android 15 and above.
      SCREEN_TIMEOUT_ENFORCED = 2;
    }
    // Optional. Controls whether the user is allowed to configure the screen timeout.
    ScreenTimeoutMode screen_timeout_mode = 1;

    // Optional. Controls the screen timeout duration. The screen timeout duration must be greater
    // than 0, otherwise it is rejected. Additionally, it should not be greater than
    // maximumTimeToLock, otherwise the screen timeout is set to maximumTimeToLock and a
    // NonComplianceDetail with INVALID_VALUE reason and
    // SCREEN_TIMEOUT_GREATER_THAN_MAXIMUM_TIME_TO_LOCK specific reason is reported. If the screen
    // timeout is less than a certain lower bound, it is set to the lower bound. The lower bound may
    // vary across devices. If this is set, screenTimeoutMode must be SCREEN_TIMEOUT_ENFORCED.
    // Supported on Android 9 and above on fully managed devices. A NonComplianceDetail with
    // API_LEVEL is reported if the Android version is less than 9. Supported on work profiles on
    // company-owned devices on Android 15 and above.
    int64 screen_timeout_ms = 2;
  }

  // Optional. Controls the screen brightness settings.
  ScreenBrightnessSettings screen_brightness_settings = 1;

  // Optional. Controls the screen timeout settings.
  ScreenTimeoutSettings screen_timeout_settings = 2;
}

// Configuration for an always-on VPN connection.
message AlwaysOnVpnPackage {
  // The package name of the VPN app.
  string package_name = 1;

  // Disallows networking when the VPN is not connected.
  bool lockdown_enabled = 2;
}

// Configuration info for an HTTP proxy. For a direct proxy, set the host, port, and excluded_hosts
// fields. For a PAC script proxy, set the pac_uri field.
message ProxyInfo {
  // The host of the direct proxy.
  string host = 1;

  // The port of the direct proxy.
  int32 port = 2;

  // For a direct proxy, the hosts for which the proxy is bypassed. The host names may contain
  // wildcards such as *.example.com.
  repeated string excluded_hosts = 3;

  // The URI of the PAC script used to configure the proxy.
  string pac_uri = 4;
}

// A default activity for handling intents that match a particular intent filter. Note: To set up a
// kiosk, use InstallType to KIOSK rather than use persistent preferred activities.
message PersistentPreferredActivity {
  // The activity that should be the default intent handler. This should be an Android component
  // name, e.g. com.android.enterprise.app/.MainActivity. Alternatively, the value may be the
  // package name of an app, which causes Android Device Policy to choose an appropriate activity
  // from the app to handle the intent.
  string receiver_activity = 1;

  // The intent actions to match in the filter. If any actions are included in the filter, then an
  // intent's action must be one of those values for it to match. If no actions are included, the
  // intent action is ignored.
  repeated string actions = 2;

  // The intent categories to match in the filter. An intent includes the categories that it
  // requires, all of which must be included in the filter in order to match. In other words, adding
  // a category to the filter has no impact on matching unless that category is specified in the
  // intent.
  repeated string categories = 3;
}

enum PasswordQuality {
  // There are no password requirements.
  PASSWORD_QUALITY_UNSPECIFIED = 0;

  // A password is required, but there are no restrictions on what the password must contain.This,
  // when applied on personally owned work profile devices on Android 12 device-scoped, will be
  // treated as COMPLEXITY_LOW for application. See PasswordQuality for details.
  SOMETHING = 1;

  // The password must contain numeric characters.This, when applied on personally owned work
  // profile devices on Android 12 device-scoped, will be treated as COMPLEXITY_MEDIUM for
  // application. See PasswordQuality for details.
  NUMERIC = 2;

  // The password must contain numeric characters with no repeating (4444) or ordered (1234, 4321,
  // 2468) sequences.This, when applied on personally owned work profile devices on Android 12
  // device-scoped, will be treated as COMPLEXITY_MEDIUM for application. See PasswordQuality for
  // details.
  NUMERIC_COMPLEX = 3;

  // The password must contain alphabetic (or symbol) characters.This, when applied on personally
  // owned work profile devices on Android 12 device-scoped, will be treated as COMPLEXITY_HIGH for
  // application. See PasswordQuality for details.
  ALPHABETIC = 4;

  // The password must contain both numeric and alphabetic (or symbol) characters.This, when applied
  // on personally owned work profile devices on Android 12 device-scoped, will be treated as
  // COMPLEXITY_HIGH for application. See PasswordQuality for details.
  ALPHANUMERIC = 5;

  // The password must meet the minimum requirements specified in passwordMinimumLength,
  // passwordMinimumLetters, passwordMinimumSymbols, etc. For example, if passwordMinimumSymbols is
  // 2, the password must contain at least two symbols.This, when applied on personally owned work
  // profile devices on Android 12 device-scoped, will be treated as COMPLEXITY_HIGH for
  // application. In this case, the requirements in passwordMinimumLength, passwordMinimumLetters,
  // passwordMinimumSymbols, etc are not applied. See PasswordQuality for details.
  COMPLEX = 6;

  // Define the low password complexity band as: pattern PIN with repeating (4444) or ordered (1234,
  // 4321, 2468) sequencesThis sets the minimum complexity band which the password must
  // meet.Enforcement varies among different Android versions, management modes and password scopes.
  // See PasswordQuality for details.
  COMPLEXITY_LOW = 7;

  // Define the medium password complexity band as: PIN with no repeating (4444) or ordered (1234,
  // 4321, 2468) sequences, length at least 4 alphabetic, length at least 4 alphanumeric, length at
  // least 4This sets the minimum complexity band which the password must meet.Enforcement varies
  // among different Android versions, management modes and password scopes. See PasswordQuality for
  // details.
  COMPLEXITY_MEDIUM = 8;

  // Define the high password complexity band as:On Android 12 and above: PIN with no repeating
  // (4444) or ordered (1234, 4321, 2468) sequences, length at least 8 alphabetic, length at least 6
  // alphanumeric, length at least 6This sets the minimum complexity band which the password must
  // meet.Enforcement varies among different Android versions, management modes and password scopes.
  // See PasswordQuality for details.
  COMPLEXITY_HIGH = 9;
}

enum PasswordScope {
  // The scope is unspecified. The password requirements are applied to the work profile for work
  // profile devices and the whole device for fully managed or dedicated devices.
  SCOPE_UNSPECIFIED = 0;

  // The password requirements are only applied to the device.
  SCOPE_DEVICE = 1;

  // The password requirements are only applied to the work profile.
  SCOPE_PROFILE = 2;
}

enum RequirePasswordUnlock {
  // Unspecified. Defaults to USE_DEFAULT_DEVICE_TIMEOUT.
  REQUIRE_PASSWORD_UNLOCK_UNSPECIFIED = 0;

  // The timeout period is set to the device’s default.
  USE_DEFAULT_DEVICE_TIMEOUT = 1;

  // The timeout period is set to 24 hours.
  REQUIRE_EVERY_DAY = 2;
}

// Requirements for the password used to unlock a device.
message PasswordRequirements {
  // The required password quality.
  PasswordQuality password_quality = 1;

  // The minimum allowed password length. A value of 0 means there is no restriction. Only enforced
  // when password_quality is NUMERIC, NUMERIC_COMPLEX, ALPHABETIC, ALPHANUMERIC, or COMPLEX.
  int32 password_minimum_length = 2;

  // Minimum number of letters required in the password. Only enforced when password_quality is
  // COMPLEX.
  int32 password_minimum_letters = 3;

  // Minimum number of lower case letters required in the password. Only enforced when
  // password_quality is COMPLEX.
  int32 password_minimum_lower_case = 4;

  // Minimum number of upper case letters required in the password. Only enforced when
  // password_quality is COMPLEX.
  int32 password_minimum_upper_case = 5;

  // Minimum number of non-letter characters (numerical digits or symbols) required in the password.
  // Only enforced when password_quality is COMPLEX.
  int32 password_minimum_non_letter = 6;

  // Minimum number of numerical digits required in the password. Only enforced when
  // password_quality is COMPLEX.
  int32 password_minimum_numeric = 7;

  // Minimum number of symbols required in the password. Only enforced when password_quality is
  // COMPLEX.
  int32 password_minimum_symbols = 8;

  // The length of the password history. After setting this field, the user won't be able to enter a
  // new password that is the same as any password in the history. A value of 0 means there is no
  // restriction.
  int32 password_history_length = 9;

  // Number of incorrect device-unlock passwords that can be entered before a device is wiped. A
  // value of 0 means there is no restriction.
  int32 maximum_failed_passwords_for_wipe = 10;

  // Password expiration timeout.
  int64 password_expiration_timeout_ms = 11;

  // The length of time after a device or work profile is unlocked using a strong form of
  // authentication (password, PIN, pattern) that it can be unlocked using any other authentication
  // method (e.g. fingerprint, trust agents, face). After the specified time period elapses, only
  // strong forms of authentication can be used to unlock the device or work profile.
  RequirePasswordUnlock require_password_unlock = 12;

  // The scope that the password requirement applies to.
  PasswordScope password_scope = 13;
}

// The default application setting for a DefaultApplicationType.
message DefaultApplicationSetting {
  // Required. The list of applications that can be set as the default app for a given type. This
  // list must not be empty or contain duplicates. The first app in the list that is installed and
  // qualified for the defaultApplicationType (e.g. SMS app for DEFAULT_SMS) is set as the default
  // app. The signing key certificate fingerprint of the app on the device must also match one of
  // the signing key certificate fingerprints obtained from Play Store or one of the entries in
  // ApplicationPolicy.signingKeyCerts in order to be set as the default.If the
  // defaultApplicationScopes contains SCOPE_FULLY_MANAGED or SCOPE_WORK_PROFILE, the app must have
  // an entry in applications with installType set to a value other than BLOCKED.A
  // NonComplianceDetail with APP_NOT_INSTALLED reason and
  // DEFAULT_APPLICATION_SETTING_FAILED_FOR_SCOPE specific reason is reported if none of the apps in
  // the list are installed. A NonComplianceDetail with INVALID_VALUE reason and
  // DEFAULT_APPLICATION_SETTING_FAILED_FOR_SCOPE specific reason is reported if at least one app is
  // installed but the policy fails to apply due to other reasons (e.g. the app is not of the right
  // type).When applying to SCOPE_PERSONAL_PROFILE on a company-owned device with a work profile,
  // only pre-installed system apps can be set as the default. A NonComplianceDetail with
  // INVALID_VALUE reason and DEFAULT_APPLICATION_SETTING_FAILED_FOR_SCOPE specific reason is
  // reported if the policy fails to apply to the personal profile.
  repeated DefaultApplication default_applications = 1;
}

// Information about the application to be set as the default.
message DefaultApplication {
  enum DefaultApplicationType {
    // Unspecified. This value must not be used.
    DEFAULT_APPLICATION_TYPE_UNSPECIFIED = 0;

    // The assistant app type. This app type is only allowed to be set for
    // SCOPE_FULLY_MANAGED.Supported on fully managed devices on Android 16 and above. A
    // NonComplianceDetail with MANAGEMENT_MODE is reported for other management modes. A
    // NonComplianceDetail with API_LEVEL is reported if the Android version is less than 16.
    DEFAULT_ASSISTANT = 1;

    // The browser app type.Supported on Android 16 and above. A NonComplianceDetail with API_LEVEL
    // is reported if the Android version is less than 16.
    DEFAULT_BROWSER = 2;

    // The call redirection app type. This app type cannot be set for
    // SCOPE_PERSONAL_PROFILE.Supported on Android 16 and above. A NonComplianceDetail with
    // API_LEVEL is reported if the Android version is less than 16.
    DEFAULT_CALL_REDIRECTION = 3;

    // The call screening app type. This app type cannot be set for SCOPE_PERSONAL_PROFILE.Supported
    // on Android 16 and above. A NonComplianceDetail with API_LEVEL is reported if the Android
    // version is less than 16.
    DEFAULT_CALL_SCREENING = 4;

    // The dialer app type.Supported on fully managed devices on Android 14 and 15. A
    // NonComplianceDetail with MANAGEMENT_MODE is reported for other management modes. A
    // NonComplianceDetail with API_LEVEL is reported if the Android version is less than
    // 14.Supported on all management modes on Android 16 and above.
    DEFAULT_DIALER = 5;

    // The home app type. This app type is only allowed to be set for SCOPE_FULLY_MANAGED.Supported
    // on fully managed devices on Android 16 and above. A NonComplianceDetail with MANAGEMENT_MODE
    // is reported for other management modes. A NonComplianceDetail with API_LEVEL is reported if
    // the Android version is less than 16.
    DEFAULT_HOME = 6;

    // The SMS app type. This app type cannot be set for SCOPE_WORK_PROFILE.Supported on company-
    // owned devices on Android 16 and above. A NonComplianceDetail with MANAGEMENT_MODE is reported
    // for personally-owned devices. A NonComplianceDetail with API_LEVEL is reported if the Android
    // version is less than 16.
    DEFAULT_SMS = 7;

    // The wallet app type. The default application of this type applies across profiles.On a
    // company-owned device with a work profile, admins can set the scope to SCOPE_PERSONAL_PROFILE
    // to set a personal profile pre-installed system app as the default, or to SCOPE_WORK_PROFILE
    // to set a work profile app as the default. It is not allowed to specify both scopes at the
    // same time.Due to a known issue, the user may be able to change the default wallet even when
    // this is set on a fully managed device.Supported on company-owned devices on Android 16 and
    // above. A NonComplianceDetail with MANAGEMENT_MODE is reported for personally-owned devices. A
    // NonComplianceDetail with API_LEVEL is reported if the Android version is less than 16.
    DEFAULT_WALLET = 8;
  }
  enum DefaultApplicationScope {
    // Unspecified. This value must not be used.
    DEFAULT_APPLICATION_SCOPE_UNSPECIFIED = 0;

    // Sets the application as the default on fully managed devices.
    SCOPE_FULLY_MANAGED = 1;

    // Sets the application as the work profile default.Only supported for DEFAULT_BROWSER,
    // DEFAULT_CALL_REDIRECTION, DEFAULT_CALL_SCREENING, DEFAULT_DIALER and DEFAULT_WALLET.
    SCOPE_WORK_PROFILE = 2;

    // Sets the application as the personal profile default on company-owned devices with a work
    // profile. Only pre-installed system apps can be set as the default.Only supported for
    // DEFAULT_BROWSER, DEFAULT_DIALER, DEFAULT_SMS and DEFAULT_WALLET.
    SCOPE_PERSONAL_PROFILE = 3;
  }
  // Required. The package name that should be set as the default application. The policy is
  // rejected if the package name is invalid.
  string package_name = 1;

  // The type of default this package becomes. Required; unspecified or unrecognised discards the
  // entry.
  DefaultApplicationType default_application_type = 2;

  // The profiles the default applies to. Empty is equivalent to SCOPE_FULLY_MANAGED.
  repeated DefaultApplicationScope default_application_scopes = 3;
}

enum AppFunctions {
  // Unspecified. Defaults to APP_FUNCTIONS_ALLOWED.
  APP_FUNCTIONS_UNSPECIFIED = 0;

  // Apps on the device for fully managed devices or in the work profile for devices with work
  // profiles are not allowed to expose app functions. If this is set, crossProfileAppFunctions must
  // not be set to CROSS_PROFILE_APP_FUNCTIONS_ALLOWED, otherwise the policy will be rejected.
  APP_FUNCTIONS_DISALLOWED = 1;

  // Apps on the device for fully managed devices or in the work profile for devices with work
  // profiles are allowed to expose app functions.
  APP_FUNCTIONS_ALLOWED = 2;
}

enum WipeDataFlag {
  // This value is ignored.
  WIPE_DATA_FLAG_UNSPECIFIED = 0;

  // For company-owned devices, this removes all eSIMs from the device when the device is wiped. In
  // personally-owned devices, this will remove managed eSIMs (eSIMs which are added via the
  // ADD_ESIM command) on the devices and no personally owned eSIMs will be removed. For devices
  // running on Android 16 or higher, managed eSIMs are always wiped when work profile is removed
  // for personally-owned devices, whether this flag is provided or not.
  WIPE_ESIMS = 1;
}

// Settings controlling the behavior of status reports.
message StatusReportingSettings {
  // Whether app reports are enabled.
  bool application_reports_enabled = 1;

  // Whether device settings reporting is enabled.
  bool device_settings_enabled = 2;

  // Whether software info reporting is enabled.
  bool software_info_enabled = 3;

  // Whether memory event reporting is enabled.
  bool memory_info_enabled = 4;

  // Whether network info reporting is enabled.
  bool network_info_enabled = 5;

  // Whether displays reporting is enabled. Report data is not available for personally owned
  // devices with work profiles.
  bool display_info_enabled = 6;

  // Whether power management event reporting is enabled. Report data is not available for
  // personally owned devices with work profiles.
  bool power_management_events_enabled = 7;

  // Whether hardware status reporting is enabled. Report data is not available for personally owned
  // devices with work profiles.
  bool hardware_status_enabled = 8;

  // Whether system properties reporting is enabled.
  bool system_properties_enabled = 9;

  // Whether Common Criteria Mode reporting is enabled. This is supported only on company-owned
  // devices.
  bool common_criteria_mode_enabled = 10;

  // Optional. Whether defaultApplicationInfo reporting is enabled.
  bool default_application_info_reporting_enabled = 11;

  // Application reporting settings. Only applicable if application_reports_enabled is true.
  ApplicationReportingSettings application_reporting_settings = 12;
}

// Settings controlling the behavior of application reports.
message ApplicationReportingSettings {
  // Whether removed apps are included in application reports.
  bool include_removed_apps = 1;
}

// Controls apps' access to private keys. The rule determines which private key, if any, Android
// Device Policy grants to the specified app. Access is granted either when the app calls
// KeyChain.choosePrivateKeyAlias (https://developer.android.com/reference/android/security/KeyChain
// #choosePrivateKeyAlias%28android.app.Activity,%20android.security.KeyChainAliasCallback,%20java.l
// ang.String[],%20java.security.Principal[],%20java.lang.String,%20int,%20java.lang.String%29) (or
// any overloads) to request a private key alias for a given URL, or for rules that are not URL-
// specific (that is, if urlPattern is not set, or set to the empty string or .*) on Android 11 and
// above, directly so that the app can call KeyChain.getPrivateKey (https://developer.android.com/re
// ference/android/security/KeyChain#getPrivateKey%28android.content.Context,%20java.lang.String%29)
// , without first having to call KeyChain.choosePrivateKeyAlias.When an app calls
// KeyChain.choosePrivateKeyAlias if more than one choosePrivateKeyRules matches, the last matching
// rule defines which key alias to return.
message ChoosePrivateKeyRule {
  // The URL pattern to match against the URL of the request. If not set or empty, it matches all
  // URLs. This uses the regular expression syntax of java.util.regex.Pattern.
  string url_pattern = 1;

  // The alias of the private key to be used.
  string private_key_alias = 2;

  // The package names to which this rule applies. The signing key certificate fingerprint of the
  // app is verified against the signing key certificate fingerprints provided by Play Store and
  // ApplicationPolicy.signingKeyCerts . If no package names are specified, then the alias is
  // provided to all apps that call KeyChain.choosePrivateKeyAlias (https://developer.android.com/re
  // ference/android/security/KeyChain#choosePrivateKeyAlias%28android.app.Activity,%20android.secur
  // ity.KeyChainAliasCallback,%20java.lang.String[],%20java.security.Principal[],%20java.lang.Strin
  // g,%20int,%20java.lang.String%29) or any overloads (but not without calling
  // KeyChain.choosePrivateKeyAlias, even on Android 11 and above). Any app with the same Android
  // UID as a package specified here will have access when they call KeyChain.choosePrivateKeyAlias.
  repeated string package_names = 3;
}

// Network configuration for the device. Xamanta-specific shape: Android Management API carries this
// as a free-form JSON Struct following the Chromium Open Network Configuration specification, while
// here it is a typed message with the same field set, so that a malformed network fails to parse at
// the edge rather than arriving as a half-applied Wi-Fi configuration.
message OpenNetworkConfiguration {
  // The networks to provision. A GUID that disappears from this list is removed from the device.
  repeated NetworkConfiguration network_configurations = 1;

  // Certificates referenced by GUID from the EAP settings of the networks above.
  repeated OncCertificate certificates = 2;
}

// One provisioned network, following the Chromium Open Network Configuration NetworkConfiguration
// object.
message NetworkConfiguration {
  // A stable identifier for the network, and the DPC's bookkeeping key. Required.
  string guid = 1;

  // A human-readable name for the network.
  string name = 2;

  // The Wi-Fi settings for this network. Required.
  WifiSettings wifi = 3;

  // A per-network proxy. Absent means no proxy. Only the manual form and PAC are expressible.
  ProxyInfo proxy_settings = 4;
}

// The Wi-Fi settings of a provisioned network, following the Chromium Open Network Configuration
// WiFi object.
message WifiSettings {
  enum Security {
    // Unspecified. The network is discarded: the DPC cannot guess how to join it.
    SECURITY_UNSPECIFIED = 0;

    // Authentication is not required.
    NONE = 1;

    // WEP with a pre-shared key.
    WEP_PSK = 2;

    // WPA or WPA2 with a pre-shared key.
    WPA_PSK = 3;

    // WPA or WPA2 Enterprise with EAP. Requires eap.
    WPA_EAP = 4;

    // Dynamic WEP with 802.1X. Requires eap.
    WEP_8021X = 5;

    // WPA3 Enterprise 192-bit mode. Requires eap.
    WPA3_ENTERPRISE_192 = 6;
  }
  enum MacAddressRandomizationMode {
    // Unspecified. The platform's default is used.
    MAC_ADDRESS_RANDOMIZATION_MODE_UNSPECIFIED = 0;

    // The device's real hardware MAC address is used. Choose this only where the network
    // authenticates by MAC address, since it makes the device trackable across networks.
    HARDWARE = 1;

    // Install automatically as soon as an update is available.
    AUTOMATIC = 2;
  }
  // The SSID as UTF-8 text. Exactly one of ssid and hex_ssid is required; when both are given they
  // must agree.
  string ssid = 1;

  // The SSID hex-encoded, for names that are not valid UTF-8.
  string hex_ssid = 2;

  // Whether the network does not broadcast its SSID, so the device must probe for it.
  bool hidden_ssid = 3;

  // The security type of the network. Required.
  Security security = 4;

  // Whether the device may join this network on its own, without the user choosing it.
  bool auto_connect = 5;

  // The pre-shared key. For WPA_PSK, 8 to 63 ASCII characters; for WEP_PSK, 10 or 26 hexadecimal
  // digits with an optional 0x prefix. Ignored for NONE and for the EAP security types.
  string passphrase = 6;

  // The EAP settings. Required by, and only read for, WPA_EAP, WEP_8021X and WPA3_ENTERPRISE_192.
  EapSettings eap = 7;

  // How the device's MAC address is presented to this network.
  MacAddressRandomizationMode mac_address_randomization_mode = 8;
}

// EAP settings for an enterprise Wi-Fi network, following the Chromium Open Network Configuration
// EAP object.
message EapSettings {
  enum Outer {
    // Unspecified. The network is discarded: there is no sane default EAP method.
    OUTER_UNSPECIFIED = 0;

    // EAP-AKA, authenticating with the SIM's UMTS credentials.
    EAP_AKA = 1;

    // EAP-TLS, authenticating with a client certificate.
    EAP_TLS = 2;

    // EAP-TTLS, tunnelling a phase-2 method inside TLS.
    EAP_TTLS = 3;

    // EAP-SIM, authenticating with the SIM's GSM credentials.
    EAP_SIM = 4;

    // EAP-PWD, authenticating with a password.
    EAP_PWD = 5;

    // PEAP, tunnelling a phase-2 method inside TLS.
    PEAP = 6;
  }
  enum Inner {
    // No phase-2 method.
    INNER_UNSPECIFIED = 0;

    // MSCHAPv2.
    MSCHAPV2 = 1;

    // Authentication type for PAP.
    PAP = 2;
  }
  enum ClientCertType {
    // No client certificate.
    CLIENT_CERT_TYPE_UNSPECIFIED = 0;

    // client_cert_ref names the GUID of a CLIENT certificate in this policy.
    REF = 1;

    // client_cert_key_pair_alias names an alias already in the keystore. Requires Android 12L.
    KEY_PAIR_ALIAS = 2;
  }
  // The outer, phase-1 EAP method. Required.
  Outer outer = 1;

  // The inner, phase-2 method, used inside EAP-TTLS and PEAP.
  Inner inner = 2;

  // The identity presented to the network.
  string identity = 3;

  // Domain suffixes the server certificate must match. Required: an empty list would accept any
  // server holding a certificate from the CA, so the DPC refuses the network and reports
  // INVALID_VALUE.
  repeated string domain_suffix_match = 4;

  // GUIDs of SERVER certificates accepted as the trust anchor for this network.
  repeated string server_ca_refs = 5;

  // Where the client certificate comes from.
  ClientCertType client_cert_type = 6;

  // The GUID of a CLIENT certificate. Required for client certificate type REF.
  string client_cert_ref = 7;

  // The alias of a key pair already in the keystore. Required for client certificate type
  // KEY_PAIR_ALIAS.
  string client_cert_key_pair_alias = 8;

  // The password, meaningful only for EAP-TTLS and PEAP.
  string password = 9;

  // The identity sent in the clear during phase 1, so that the real identity stays inside the
  // tunnel. Empty means identity is sent instead.
  string anonymous_identity = 10;
}

// A certificate provisioned along with the networks that reference it, following the Chromium Open
// Network Configuration Certificate object.
message OncCertificate {
  enum Type {
    // Unspecified. The certificate is discarded.
    TYPE_UNSPECIFIED = 0;

    // A CA certificate used as a trust anchor. x509 is required.
    SERVER = 1;

    // A client certificate and its private key. pkcs12 is required.
    CLIENT = 2;
  }
  // A stable identifier, referenced from the EAP settings of a network. Required.
  string guid = 1;

  // What the certificate is for.
  Type type = 2;

  // The certificate as Base64-encoded DER X.509. Required for SERVER.
  string x509 = 3;

  // A Base64-encoded PKCS#12 bundle holding the certificate and its private key. Required for
  // CLIENT.
  string pkcs12 = 4;

  // The passphrase protecting pkcs12. Empty means the bundle is unencrypted.
  string pkcs12_password = 5;
}

// Sent by the device to open the policy stream. Xamanta-specific: Android Management API has no
// device-initiated sync, so this carries the identity a server needs to target policies, vet the
// DPC signer and orchestrate self-updates.
message SyncRequest {
  // The device's stable identity: the OAuth client id it enrolled with, which is its ANDROID_ID.
  string device_id        = 1;

  // The DPC's application id.
  string package_name     = 2;

  // SHA-256 of the DPC's signing certificate, in hexadecimal. A server that pins this learns at
  // once if it is talking to a DPC it did not authorise.
  string signing_sha256   = 3;

  // The DPC's PackageInfo.longVersionCode.
  int64  version_code     = 4;

  // The DPC's PackageInfo.versionName.
  string version_name     = 5;

  // The device's Build.VERSION.SDK_INT.
  int32  api_level        = 6;

  // The device's Build.VERSION.RELEASE.
  string android_version  = 7;

  // The device's Build.VERSION.SECURITY_PATCH.
  string security_patch   = 8;

  // The device's Build.MODEL.
  string model            = 9;

  // The device's Build.MANUFACTURER.
  string manufacturer     = 10;

  // The device's Build.BRAND.
  string brand            = 11;
}

// A policy pushed from the server to the device on the policy stream.
message ApplyPolicyRequest {
  // The complete policy to apply. It is accepted only if it is strictly newer than the one in
  // force, by lineage and version; otherwise it is ignored in silence.
  Policy policy = 1;

  // Informational for the server's own bookkeeping. The device ignores it: a policy is applied in
  // full on every pass, so there is nothing for a force flag to change.
  bool force = 2;

  // Informational for the server's own bookkeeping. The device ignores it.
  string requested_by = 3;
}

enum Compliance {
  // The policy is fully applied: the pass produced no non-compliance details and left no
  // asynchronous work pending.
  IN_FORCE           = 0;

  // At least one setting could not be applied. The device retries with exponential backoff, from 30
  // seconds to 30 minutes.
  DEFIANCE           = 1;

  // Reserved for the server: no policy is assigned to this device. Never sent by a device.
  UNASSIGNED         = 2;

  // The policy has been received and written to the device's storage, and reconciliation is about
  // to begin. Sent after the write, not on receipt: an acknowledgement the device could still lose
  // to a crash would let the server record a version that is in force nowhere.
  PENDING_COMPLIANCE = 3;

  // Reserved for the server: the device has not synced yet. Never sent by a device.
  PENDING_SYNC       = 4;

  // Reserved for the server: the device is being decommissioned. Never sent by a device.
  DECOMMISSION       = 5;
}

enum NonComplianceReason {
  // This value is not used.
  NON_COMPLIANCE_REASON_UNSPECIFIED = 0;

  // The setting is not supported in the API level of the Android version running on the device.
  API_LEVEL         = 1;

  // The management mode (such as fully managed or work profile) doesn't support the setting.
  MANAGEMENT_MODE   = 2;

  // The user has not taken required action to comply with the setting.
  USER_ACTION       = 3;

  // The setting has an invalid value.
  INVALID_VALUE     = 4;

  // The app required to implement the policy is not installed.
  APP_NOT_INSTALLED = 5;

  // Encryption is not supported by the device.
  UNSUPPORTED       = 6;

  // A blocked app is installed.
  APP_INSTALLED     = 7;

  // The setting hasn't been applied at the time of the report, but is expected to be applied
  // shortly.
  PENDING           = 8;

  // The setting can't be applied to the app because the app doesn't support it, for example because
  // its target SDK version is not high enough.
  APP_INCOMPATIBLE  = 9;

  // The app is installed, but it hasn't been updated to the minimum version code specified by
  // policy.
  APP_NOT_UPDATED   = 10;
}

enum InstallationFailureReason {
  // This value is disallowed.
  INSTALLATION_FAILURE_REASON_UNSPECIFIED = 0;

  // An unknown condition is preventing the app from being installed. Some potential reasons are
  // that the device doesn't have enough storage, the device network connection is unreliable, or
  // the installation is taking longer than expected. The installation will be retried
  // automatically.
  INSTALLATION_FAILURE_REASON_UNKNOWN     = 1;

  // The installation is still in progress.
  IN_PROGRESS                             = 2;

  // The app was not found in Play.
  NOT_FOUND                               = 3;

  // The app is incompatible with the device.
  NOT_COMPATIBLE_WITH_DEVICE              = 4;

  // The app has not been approved by the admin.
  NOT_APPROVED                            = 5;

  // The app has new permissions that have not been accepted by the admin.
  PERMISSIONS_NOT_ACCEPTED                = 6;

  // The app is not available in the user's country.
  NOT_AVAILABLE_IN_COUNTRY                = 7;

  // There are no licenses available to assign to the user.
  NO_LICENSES_REMAINING                   = 8;

  // The enterprise is no longer enrolled with Managed Google Play or the admin has not accepted the
  // latest Managed Google Play Terms of Service.
  NOT_ENROLLED                            = 9;

  // The user is no longer valid. The user may have been deleted or disabled.
  USER_INVALID                            = 10;

  // A network error on the user's device has prevented the install from succeeding. This usually
  // happens when the device's internet connectivity is degraded, unavailable or there's a network
  // configuration issue. Please ensure the device has access to full internet connectivity on a
  // network that meets Android Enterprise Network Requirements
  // (https://support.google.com/work/android/answer/10513641). App install or update will
  // automatically resume once this is the case.
  NETWORK_ERROR_UNRELIABLE_CONNECTION     = 11;

  // The user's device does not have sufficient storage space to install the app. This can be
  // resolved by clearing up storage space on the device. App install or update will automatically
  // resume once the device has sufficient storage.
  INSUFFICIENT_STORAGE                    = 12;
}

// Provides detail about non-compliance with a policy setting.
message NonComplianceDetail {
  // The name of the policy setting. This is the JSON field name of a top-level Policy field.
  string setting_name                                = 1;

  // The reason the device is not in compliance with the setting.
  NonComplianceReason non_compliance_reason          = 2;

  // The package name indicating which app is out of compliance, if applicable.
  string package_name                                = 3;

  // For settings with nested fields, if a particular nested field is out of compliance, this
  // specifies the full path to the offending field. The path is formatted in the same way the
  // policy JSON field would be referenced in JavaScript, that is: 1) For object-typed fields, the
  // field name is followed by a dot then by a subfield name. 2) For array-typed fields, the field
  // name is followed by the array index enclosed in brackets. For example, to indicate a problem
  // with the url field in the externalData field in the 3rd application, the path would be
  // applications[2].externalData.url
  string field_path                                  = 4;

  // If the policy setting could not be applied, the current value of the setting on the device.
  string current_value                               = 5;

  // If package_name is set and the non-compliance reason is APP_NOT_INSTALLED or APP_NOT_UPDATED,
  // the detailed reason the app can't be installed or updated.
  InstallationFailureReason installation_failure_reason = 6;
}

// The device's report on one reconciliation pass.
message ApplyPolicyResponse {
  // The overall compliance state.
  Compliance compliance               = 1;

  // What could not be applied. Empty except with DEFIANCE.
  repeated NonComplianceDetail details = 2;

  // Identifies the pass, as v<version>.<n> where n increases within the process. One policy version
  // can produce several reports, and this tells them apart.
  string execution_id                 = 3;

  // The time at which the report was produced, as an ISO-8601 instant.
  string applied_at                   = 4;
}

// The server's acknowledgement of a compliance report.
message ComplianceAck {
  // Whether the server received the report. The device does not retry on false; the next pass
  // reports again.
  bool received = 1;
}

// The policy channel. The device is the gRPC client; both calls carry an OAuth bearer token.
service PolicySyncService {
  // Opens the policy stream. The device sends its identity once and the server streams a policy
  // whenever an administrator changes one. The device keeps the last accepted lineage and version,
  // and accepts an incoming policy only when its lineage differs or its version is strictly
  // greater, so a replayed stream cannot roll the device back.
  rpc SyncPolicy(SyncRequest) returns (stream ApplyPolicyRequest);

  // Reports the outcome of applying a policy: once with PENDING_COMPLIANCE as soon as the policy
  // has been persisted, then again with the verdict of each reconciliation pass.
  rpc ReportCompliance(ApplyPolicyResponse) returns (ComplianceAck);
}
